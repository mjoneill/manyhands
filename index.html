  return el;
}

// ── Dispatch: render a card normally or in edit mode ──
function renderCardOrEdit(card) {
  if (editingCardId === card.id) return renderCardEditForm(card);
  return renderCard(card);
}

// ── Edit Card Actions ──
function editCard(cardId) {
  if (editingCardId === cardId) return;
  editingCardId = cardId;
  renderBoard();
  // Focus the title input after render
  requestAnimationFrame(() => {
    const titleInput = document.querySelector(`.card[data-id="${cardId}"] .edit-title`);
    if (titleInput) {
      titleInput.focus();
      titleInput.select();
    }
  });
}

function saveEdit(cardId) {
  const cardEl = document.querySelector(`.card[data-id="${cardId}"]`);
  if (!cardEl) return;
  const card = cards.find(c => c.id === cardId);
  if (!card) return;

  const titleInput = cardEl.querySelector('.edit-title');
  const title = titleInput.value.trim();
  if (!title) {
    titleInput.focus();
    titleInput.style.borderColor = '#f87171';
    setTimeout(() => { titleInput.style.borderColor = ''; }, 1500);
    return;
  }

  card.title = title;
  card.description = cardEl.querySelector('.edit-desc').value.trim();
  card.type = cardEl.querySelector('.edit-type').value;
  // Read multi-select assignee checkboxes (#51). Empty selection → ['unassigned'].
  const checkedAssignees = Array.from(
    cardEl.querySelectorAll('.edit-assignees-group input[type="checkbox"]:checked')
  ).map(cb => cb.value);
  card.assignees = checkedAssignees.length > 0 ? checkedAssignees : ['unassigned'];
  card.column = cardEl.querySelector('.edit-column').value;
  card.priority = cardEl.querySelector('.edit-priority').value || null;
  card.labels = cardEl.querySelector('.edit-labels').value
    .split(',')
    .map(l => l.trim())
    .filter(l => l.length > 0);
  // Store as-is: empty string means "user explicitly cleared this field".
  // Don't coerce to null — the rendering check `if (card.for)` correctly
  // treats both '' and null as falsy, but downstream consumers may want
  // to distinguish "never set" (null) from "deliberately cleared" ('').
  card.for = cardEl.querySelector('.edit-for').value.trim();
  card.updatedAt = new Date().toISOString();

  // Apply relationship changes (Card #42)
  const parseShortIds = (str) => {
    return str.split(/[,\s]+/)
      .map(s => s.trim())
      .filter(s => s.length > 0)
      .map(s => s.startsWith('#') ? s.slice(1) : s)
      .map(s => parseInt(s, 10))
      .filter(n => !isNaN(n));
  };
  const desiredRelatedTo = parseShortIds(cardEl.querySelector('.edit-related-to').value);
  const desiredBlockedBy = parseShortIds(cardEl.querySelector('.edit-blocked-by').value);
  const currentRelatedTo = (card.relationships && card.relationships.relatedTo) || [];
  const currentBlockedBy = (card.relationships && card.relationships.blockedBy) || [];

  // Remove relationships that were dropped
  currentRelatedTo.filter(sid => !desiredRelatedTo.includes(sid))
    .forEach(sid => removeRelationship(cardId, 'relatedTo', sid));
  currentBlockedBy.filter(sid => !desiredBlockedBy.includes(sid))
    .forEach(sid => removeRelationship(cardId, 'blockedBy', sid));
  // Add new relationships
  desiredRelatedTo.filter(sid => !currentRelatedTo.includes(sid))
    .forEach(sid => setRelationship(cardId, 'relatedTo', sid));
  desiredBlockedBy.filter(sid => !currentBlockedBy.includes(sid))
    .forEach(sid => setRelationship(cardId, 'blockedBy', sid));

  editingCardId = null;
  saveToLocalStorage();
  saveToJSONFile(); // Fire-and-forget JSON sync
  _testHookMarkSaved();
  renderBoard();
}

function cancelEdit() {
  editingCardId = null;
  renderBoard();
}

// ── Escape HTML ──
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Attribute-safe variant: escapeHTML() (textContent→innerHTML) encodes & < >
// but NOT quotes, so a value placed inside a "double-quoted" HTML attribute can
// still break out via a literal ". escapeAttr() encodes " too. Use it for any
// untrusted value interpolated into an attribute. #249.
function escapeAttr(str) {
  return escapeHTML(String(str)).replace(/"/g, '&quot;');
}

// ── Render description with #N shortId links ──
function renderDescriptionWithLinks(desc) {
  return escapeHTML(desc).replace(/#(\d+)/g, '<a href="#" class="shortid-link" data-action="shortid-link" data-shortid="$1" title="Go to card #$1">#$1</a>');
}

// ── Scroll to and highlight a card by shortId ──
function scrollToCardByShortId(shortId) {
  const targetCard = cards.find(c => c.shortId === shortId);
  if (!targetCard) return;
  // #335 — a deep-linked card may be HIDDEN from the DOM: folded behind the
  // backlog "show N older" (stale) expander, or inside a collapsed column. Left
  // unhandled, the link silently no-ops and dumps you into the board (the bug
  // hit when clicking a raised-hands item). Un-hide the card first, then
  // scroll. A card with a fresh raise but old card-fields reads as "stale," so
  // the blocked-panel's own targets are exactly the ones most likely folded.
  let needsRerender = false;
  if (collapsedColumns.has(targetCard.column)) {
    collapsedColumns.delete(targetCard.column); // session-only un-collapse (not persisted — don't clobber their preference)
    needsRerender = true;
  }
  if (targetCard.column === 'backlog' && isStaleCard(targetCard) && !_staleExpanded.has('backlog')) {
    _staleExpanded.add('backlog');
    needsRerender = true;
  }
  if (needsRerender) renderBoard();
  const cardEl = document.querySelector(`.card[data-id="${targetCard.id}"]`);
  if (!cardEl) return;
  cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  cardEl.classList.add('highlighted');
  setTimeout(() => cardEl.classList.remove('highlighted'), 1500);
}

// ── #498 — Filter menu ───────────────────────────────────────────────────
// Built from the values PRESENT on the board, so it never offers a filter that
// would return nothing. Each option carries data-filter-add (the #498 contract
// selector) and reuses the same toggle* functions the card chips used to call —
// the filtering logic was never the defect; its only entry point being a
// misclick target on a card was.
function renderFilterMenu() {
  const menu = document.getElementById('filter-menu');
  if (!menu) return;
  const assignees = new Set(), priorities = new Set(), labels = new Set();
  for (const c of cards) {
    for (const a of (c.assignees || [])) if (a && a !== 'unassigned') assignees.add(a);
    if (c.priority) priorities.add(c.priority);
    for (const l of (c.labels || [])) if (l) labels.add(l);
  }
  const groups = [
    ['Assignee', [...assignees].sort(), 'toggle-assignee', 'assignee', activeAssignees,
      (k) => `${ASSIGNEE_EMOJI[k] || '⬜'} ${ASSIGNEE_NAME[k] || k}`],
    ['Priority', [...priorities].sort(), 'toggle-priority', 'priority', activePriorities,
      (k) => String(k).toUpperCase()],
    ['Label', [...labels].sort(), 'toggle-label', 'label', activeLabels, (k) => k],
  ];
  let html = '';
  for (const [title, values, action, attr, activeSet, render] of groups) {
    if (!values.length) continue;
    html += `<div class="filter-menu-group">${escapeHTML(title)}</div>`;
    for (const v of values) {
      html += `<button type="button" class="filter-menu-item" data-filter-add data-action="${action}" data-${attr}="${escapeAttr(v)}" aria-pressed="${activeSet.has(v) ? 'true' : 'false'}">${escapeHTML(render(v))}</button>`;
    }
  }
  menu.innerHTML = html || '<div class="filter-menu-empty">No cards to filter yet.</div>';
}

function setFilterMenuOpen(open) {
  const menu = document.getElementById('filter-menu');
  const btn = document.getElementById('btn-filter');
  if (!menu || !btn) return;
  if (open) renderFilterMenu();
  menu.hidden = !open;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

// ── Render Filter Strip ──
function renderFilterStrip() {
  const strip = document.getElementById('filter-strip');
  if (!strip) return;
  strip.innerHTML = '';
  const hasFilters = activeLabels.size > 0 || activeAssignees.size > 0 || activePriorities.size > 0;
  if (!hasFilters) {
    strip.classList.remove('visible');
    return;
  }

  const labelSpan = document.createElement('span');
  labelSpan.className = 'filter-strip-label';
  labelSpan.textContent = 'Filtering by:';
  strip.appendChild(labelSpan);

  // Assignee chips (teal/green — visually distinct from label chips)
  for (const assigneeKey of activeAssignees) {
    const chip = document.createElement('span');
    chip.className = 'filter-chip-assignee';
    const emoji = ASSIGNEE_EMOJI[assigneeKey] || '⬜';
    const name = ASSIGNEE_NAME[assigneeKey] || assigneeKey;
    const emojiSpan = document.createElement('span');
    emojiSpan.className = 'chip-emoji';
    emojiSpan.textContent = emoji;
    chip.appendChild(emojiSpan);
    chip.appendChild(document.createTextNode(name.toUpperCase()));
    const x = document.createElement('button');
    x.className = 'filter-chip-x';
    x.dataset.action = 'remove-assignee';
    x.dataset.assignee = assigneeKey;
    x.title = 'Remove this assignee from filter';
    x.setAttribute('aria-label', `Remove ${name} from filter`);
    x.textContent = '×';
    chip.appendChild(x);
    strip.appendChild(chip);
  }

  // Priority chips (color-coded — match the badge color)
  for (const priority of activePriorities) {
    const chip = document.createElement('span');
    chip.className = `filter-chip-priority filter-chip-priority-${priority}`;
    chip.appendChild(document.createTextNode(`PRIORITY ${priority.toUpperCase()}`));
    const x = document.createElement('button');
    x.className = 'filter-chip-x';
    x.dataset.action = 'remove-priority';
    x.dataset.priority = priority;
    x.title = 'Remove this priority from filter';
    x.setAttribute('aria-label', `Remove ${priority.toUpperCase()} from filter`);
    x.textContent = '×';
    chip.appendChild(x);
    strip.appendChild(chip);
  }

  // Label chips (blue — original style)
  for (const lbl of activeLabels) {
    const chip = document.createElement('span');
    chip.className = 'filter-chip';
    chip.textContent = lbl;
    const x = document.createElement('button');
    x.className = 'filter-chip-x';
    x.dataset.action = 'remove-label';
    x.dataset.label = lbl;
    x.title = 'Remove this label from filter';
    x.setAttribute('aria-label', `Remove ${lbl} from filter`);
    x.textContent = '×';
    chip.appendChild(x);
    strip.appendChild(chip);
  }

  // AND/OR toggle for label filtering (only show when 2+ labels selected)
  if (activeLabels.size >= 2) {
    const toggle = document.createElement('button');
    toggle.className = 'label-mode-toggle';
    toggle.dataset.action = 'toggle-label-mode';
    toggle.title = 'Click to toggle between AND/OR label filtering';
    if (labelFilterMode === 'or') {
      toggle.innerHTML = '<span class="mode-and">AND</span> | <span class="mode-or active">OR</span>';
    } else {
      toggle.innerHTML = '<span class="mode-and active">AND</span> | <span class="mode-or">OR</span>';
    }
    strip.appendChild(toggle);
  }

  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn-clear-filter';
  clearBtn.dataset.action = 'clear-filter';
  clearBtn.dataset.filterClear = '';   // #498 contract selector
  clearBtn.textContent = 'Clear all';
  strip.appendChild(clearBtn);
  strip.classList.add('visible');
}

// ── Render Column Headers ──
const COLUMN_EMOJI = { backlog: '📥', 'in-progress': '⚡', done: '✅' };

function getColumnDisplayName(columnId) {
  return columnNames[columnId] || titleCase(columnId);
}

function renderColumnHeader(columnId, count) {
  const name = getColumnDisplayName(columnId);
  const emoji = COLUMN_EMOJI[columnId] || '📌';
  return `${emoji} ${name}`;
}

function updateColumnHeader(columnId) {
  const header = document.querySelector(`.column-header[data-column-id="${columnId}"]`);
  if (!header) return;
  const nameSpan = header.querySelector('.column-name-text');
  if (!nameSpan) return;
  const count = header.querySelector('.count');
  nameSpan.textContent = renderColumnHeader(columnId, count ? count.textContent : '0');
}

function updateAllColumnHeaders() {
  updateColumnHeader('backlog');
  updateColumnHeader('in-progress');
  updateColumnHeader('done');
}

// #303-4 — backlog staleness + column collapse (pure view; nothing moves or
// changes card state). A deep backlog buries live work; cards untouched 30+ days
// fold behind a "show N older" expander, and any column can be collapsed to just
// its header. Both states are per-browser (localStorage) and survive re-render.
const STALE_DAYS = 30;
const STALE_MS = STALE_DAYS * 24 * 60 * 60 * 1000;
// Only fold when there are enough stale cards to actually declutter — hiding one
// or two old cards behind an expander is worse than just showing them.
const STALE_MIN_TO_FOLD = 5;
function isStaleCard(card) {
  const t = Date.parse(card && card.updatedAt);
  return Number.isFinite(t) && (Date.now() - t) > STALE_MS;
}
const _staleExpanded = new Set(); // column ids whose "older" section is open (session)
const COLLAPSED_COLS_KEY = 'manyhands-collapsed-columns';
function loadCollapsedColumns() {
  try { return new Set(JSON.parse(localStorage.getItem(COLLAPSED_COLS_KEY)) || []); }
  catch { return new Set(); }
}
let collapsedColumns = loadCollapsedColumns();
function saveCollapsedColumns() {
  try { localStorage.setItem(COLLAPSED_COLS_KEY, JSON.stringify([...collapsedColumns])); } catch { /* ignore */ }
}

// ── Render Board ──
// Build a column DOM element (column + header + empty body) for the given
// column object. Caller is responsible for appending it to the board.
// Default columns (backlog/in-progress/done) get their legacy class names
// preserved (.backlog-header, etc.) so existing CSS selectors keep working.
function _buildColumnElement(col) {
  const DEFAULTS = new Set(['backlog', 'in-progress', 'done']);
  const colEl = document.createElement('div');
  colEl.className = 'column';
  colEl.id = `column-${col.id}`;

  const header = document.createElement('div');
  header.className = 'column-header';
  if (DEFAULTS.has(col.id)) header.classList.add(`${col.id}-header`);
  header.dataset.columnId = col.id;
  header.draggable = true;

  const emoji = COLUMN_EMOJI[col.id] || '📌';
  const displayName = (typeof getColumnDisplayName === 'function')
    ? getColumnDisplayName(col.id)
    : (col.name || col.id);
  header.innerHTML =
    `<button class="column-collapse-btn" data-action="toggle-column-collapse" data-column-id="${escapeAttr(col.id)}" title="Collapse / expand column" aria-label="Collapse or expand column">▾</button>` +
    `<span class="column-name-text">${emoji} ${escapeHTML(displayName)}</span>` +
    `<button class="column-edit-btn" data-action="edit-column" data-column-id="${col.id}" title="Edit column">✏️</button>` +
    `<span class="count" id="${col.id}-count">0</span>`;

  const body = document.createElement('div');
  body.className = 'column-body';
  body.id = `${col.id}-body`;

  colEl.appendChild(header);
  colEl.appendChild(body);
  return colEl;
}

function renderBoard() {
  const visibleCards = cards.filter(cardMatchesActiveFilter);

  // Bucket visible cards by their column id
  const cardsByColumn = {};
  columns.forEach(col => { cardsByColumn[col.id] = []; });
  visibleCards.forEach(c => {
    if (cardsByColumn[c.column]) cardsByColumn[c.column].push(c);
  });

  const boardEl = document.getElementById('board');
  const formWrapperEl = document.getElementById('add-card-form-wrapper');
  const templateBtnExpand = document.getElementById('btn-expand-form'); // persistent id'd btn from hidden-templates

  // Snapshot existing column elements (so we reuse them and preserve any
  // event listeners or state attached to them)
  const existingColumns = new Map();
  document.querySelectorAll('.column[id^="column-"]').forEach(el => {
    existingColumns.set(el.id.replace('column-', ''), el);
  });

  // Sort columns by their .order field (defensive — should already be in order)
  const sortedColumns = [...columns].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  // Clear the board; we'll re-attach columns + the add-column button in order
  boardEl.innerHTML = '';

  // Helper: create a fresh + add-card button for a non-backlog column.
  // Backlog uses the persistent id'd button from hidden-templates.
  function _makeFreshExpandButton(colId) {
    const btn = document.createElement('button');
    btn.className = 'btn-expand-form';
    btn.dataset.columnId = colId;
    btn.title = 'Add new card';
    btn.textContent = '+';
    if (currentAddCardColumn === colId && formWrapperEl &&
        formWrapperEl.classList.contains('expanded')) {
      btn.classList.add('active');
    }
    return btn;
  }

  // For each column in sorted order: reuse or build, update content, append
  sortedColumns.forEach(col => {
    let colEl = existingColumns.get(col.id);
    if (!colEl) {
      colEl = _buildColumnElement(col);
    }

    // #303-4 — apply persisted collapse state (header-only when collapsed).
    colEl.classList.toggle('collapsed', collapsedColumns.has(col.id));

    // Update header name (in case it changed) and count
    const nameSpan = colEl.querySelector('.column-name-text');
    if (nameSpan) {
      const emoji = COLUMN_EMOJI[col.id] || '📌';
      const displayName = getColumnDisplayName(col.id);
      nameSpan.textContent = `${emoji} ${displayName}`;
    }
    const countEl = colEl.querySelector('.count');
    if (countEl) {
      countEl.id = `${col.id}-count`; // ensure id is correct if column was renamed
      countEl.textContent = (cardsByColumn[col.id] || []).length;
    }

    // Update body content
    const body = colEl.querySelector('.column-body');
    if (body) {
      body.id = `${col.id}-body`; // ensure id is correct
      body.innerHTML = '';

      // + button: backlog uses the persistent id'd template; others get fresh
      if (col.id === 'backlog' && templateBtnExpand) {
        body.appendChild(templateBtnExpand);
      } else {
        body.appendChild(_makeFreshExpandButton(col.id));
      }

      // Form wrapper goes into whichever column is the current add-card target
      if (currentAddCardColumn === col.id && formWrapperEl) {
        body.appendChild(formWrapperEl);
      }

      // Cards or empty state
      const colCards = cardsByColumn[col.id] || [];
      if (colCards.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = col.id === 'in-progress' ? 'Drop cards here' : 'No cards yet';
        body.appendChild(empty);
      } else {
        // #303-4 — in the backlog, fold cards untouched 30+ days behind a
        // "show N older" expander so the live top of the backlog isn't buried.
        // Only kicks in for the backlog and only when something is actually
        // stale; every other column renders straight through. A card being
        // edited stays visible regardless (don't hide an in-flight edit).
        const fresh = [], stale = [];
        if (col.id === 'backlog') {
          for (const c of colCards) ((isStaleCard(c) && c.id !== editingCardId) ? stale : fresh).push(c);
        }
        if (col.id !== 'backlog' || stale.length < STALE_MIN_TO_FOLD) {
          colCards.forEach(c => body.appendChild(renderCardOrEdit(c)));
        } else {
          fresh.forEach(c => body.appendChild(renderCardOrEdit(c)));
          const open = _staleExpanded.has(col.id);
          const toggle = document.createElement('button');
          toggle.className = 'stale-toggle';
          toggle.dataset.action = 'toggle-stale';
          toggle.dataset.columnId = col.id;
          toggle.textContent = open
            ? `▾ hide ${stale.length} older`
            : `▸ show ${stale.length} older (untouched ${STALE_DAYS}+ days)`;
          body.appendChild(toggle);
          if (open) stale.forEach(c => body.appendChild(renderCardOrEdit(c)));
        }
      }
    }

    // Append to board in sorted order — this is what makes visual reorder work
    boardEl.appendChild(colEl);
  });

  // Append the + add-column button at the end (reuse existing or create)
  let addColBtn = document.getElementById('btn-add-column');
  if (!addColBtn) {
    addColBtn = document.createElement('button');
    addColBtn.id = 'btn-add-column';
    addColBtn.className = 'btn-add-column';
    addColBtn.title = 'Add a new column';
    addColBtn.textContent = '+';
  }
  boardEl.appendChild(addColBtn);

  renderFilterStrip();
}

// ── Drag-and-Drop State ──
let draggedCardId = null;
let draggedColumnId = null;

// ── Undo state (#31) — LIFO stack of pre-mutation snapshots ──
const _undoStack = [];
const UNDO_STACK_MAX = 20;

// Snapshot a card's column + array index BEFORE a mutation. Caller fires this
// immediately before the actual change.
function pushUndoEntry(card) {
  if (!card) return;
  const entry = {
    cardId: card.id,
    column: card.column,
    arrayIndex: cards.findIndex(c => c.id === card.id),
    title: card.title,
    timestamp: Date.now(),
  };
  _undoStack.push(entry);
  if (_undoStack.length > UNDO_STACK_MAX) _undoStack.shift();
}

function undoLastMove() {
  if (_undoStack.length === 0) return false;
  const entry = _undoStack.pop();
  const card = cards.find(c => c.id === entry.cardId);
  if (!card) return false;
  const currentIdx = cards.findIndex(c => c.id === entry.cardId);
  if (currentIdx >= 0) cards.splice(currentIdx, 1);
  card.column = entry.column;
  const targetIdx = Math.min(Math.max(0, entry.arrayIndex), cards.length);
  cards.splice(targetIdx, 0, card);
  card.updatedAt = new Date().toISOString();
  saveToLocalStorage();
  saveToJSONFile();
  _testHookMarkSaved();
  renderBoard();
  showUndoToast(`Undid: "${entry.title}" returned to ${entry.column}`);
  return true;
}

function showUndoToast(msg) {
  let toast = document.getElementById('undo-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'undo-toast';
    toast.className = 'undo-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 2500);
}

// ── Drag Event Handlers ──
function handleDragStart(e) {
  // Card drag — takes precedence over column drag (cards are nested inside columns)
  const cardEl = e.target.closest('.card');
  if (cardEl) {
    if (cardEl.classList.contains('editing')) {
      e.preventDefault();
      return;
    }
    draggedCardId = cardEl.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedCardId);
    requestAnimationFrame(() => {
      cardEl.classList.add('dragging');
    });
    return;
  }
  // Column header drag (Card #41) — for reordering columns
  const headerEl = e.target.closest('.column-header');
  if (headerEl && !headerEl.classList.contains('editing')) {
    draggedColumnId = headerEl.dataset.columnId;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('application/x-column-id', draggedColumnId);
  }
}

// Reorder columns in the canonical array. Note: hardcoded default columns
// (backlog, in-progress, done) keep their position in the HTML — only the
// underlying columns array changes. A future card refactors HTML to make
// reorder fully visual for defaults. Dynamic columns DO reorder visually
// because they're appended by renderBoard.
function reorderColumn(draggedId, targetColumnId, side = 'before') {
  if (draggedId === targetColumnId) return;
  const draggedIdx = columns.findIndex(c => c.id === draggedId);
  const targetIdx = columns.findIndex(c => c.id === targetColumnId);
  if (draggedIdx < 0 || targetIdx < 0) return;
  const [dragged] = columns.splice(draggedIdx, 1);
  // After splice, target index may shift by 1 if dragged was before target
  let insertAt = draggedIdx < targetIdx ? targetIdx - 1 : targetIdx;
  if (side === 'after') insertAt++;
  columns.splice(insertAt, 0, dragged);
  columns.forEach((c, i) => { c.order = i; });
  saveToJSONFile();
  _testHookMarkSaved();
  renderBoard();
}

// ── Insertion-indicator helpers (used by column drag #49 and card drag #30) ──
function _computeColumnInsertionSide(targetCol, clientX) {
  // Programmatic drops without a cursor position (clientX undefined/NaN) fall
  // through to 'before' — the pre-#49 behavior. Mouse-driven drops always
  // supply clientX and get true left/right-half discrimination.
  if (typeof clientX !== 'number' || Number.isNaN(clientX)) return 'before';
  const rect = targetCol.getBoundingClientRect();
  return clientX < rect.left + rect.width / 2 ? 'before' : 'after';
}

function _showColumnInsertionIndicator(targetCol, side) {
  let indicator = document.querySelector('.column-insertion-indicator');
  if (!indicator) {
    indicator = document.createElement('div');
    indicator.className = 'column-insertion-indicator';
    document.body.appendChild(indicator);
  }
  const rect = targetCol.getBoundingClientRect();
  indicator.dataset.side = side;
  indicator.dataset.targetId = targetCol.id.replace('column-', '');
  const x = side === 'before' ? rect.left - 1 : rect.right - 1;
  indicator.style.left = (x + window.scrollX) + 'px';
  indicator.style.top = (rect.top + window.scrollY) + 'px';
  indicator.style.height = rect.height + 'px';
}

function _clearInsertionIndicators() {
  document.querySelectorAll('.column-insertion-indicator, .card-insertion-indicator').forEach(el => el.remove());
}

// Card insertion (#30): cursor Y → position-in-column resolution and indicator
function _computeCardInsertionPosition(columnBody, clientY) {
  // Eligible targets = visible cards in this column body, excluding the one
  // currently being dragged (which is still in the DOM with .dragging class).
  const cardEls = Array.from(columnBody.querySelectorAll('.card'))
    .filter(el => !el.classList.contains('dragging'));
  for (let i = 0; i < cardEls.length; i++) {
    const rect = cardEls[i].getBoundingClientRect();
    if (clientY < rect.top + rect.height / 2) {
      return { position: i, beforeEl: cardEls[i] };
    }
  }
  return { position: cardEls.length, beforeEl: null };
}

function _showCardInsertionIndicator(columnBody, beforeEl) {
  let indicator = document.querySelector('.card-insertion-indicator');
  if (!indicator) {
    indicator = document.createElement('div');
    indicator.className = 'card-insertion-indicator';
    document.body.appendChild(indicator);
  }
  if (beforeEl) {
    const rect = beforeEl.getBoundingClientRect();
    indicator.style.left = (rect.left + window.scrollX) + 'px';
    indicator.style.top = (rect.top + window.scrollY - 2) + 'px';
    indicator.style.width = rect.width + 'px';
  } else {
    // After last card — anchor to bottom of last card, or to column body if empty
    const cardEls = Array.from(columnBody.querySelectorAll('.card'))
      .filter(el => !el.classList.contains('dragging'));
    if (cardEls.length === 0) {
      const bodyRect = columnBody.getBoundingClientRect();
      indicator.style.left = (bodyRect.left + 12 + window.scrollX) + 'px';
      indicator.style.top = (bodyRect.top + 8 + window.scrollY) + 'px';
      indicator.style.width = (bodyRect.width - 24) + 'px';
    } else {
      const lastRect = cardEls[cardEls.length - 1].getBoundingClientRect();
      indicator.style.left = (lastRect.left + window.scrollX) + 'px';
      indicator.style.top = (lastRect.bottom + window.scrollY + 1) + 'px';
      indicator.style.width = lastRect.width + 'px';
    }
  }
}

// Splice dragged card into the global cards array such that within its target
// column it ends up at `position`. Updates card.column. Caller saves + renders.
function _insertCardAtPosition(draggedCard, targetColumn, position) {
  const currentIdx = cards.findIndex(c => c.id === draggedCard.id);
  if (currentIdx >= 0) cards.splice(currentIdx, 1);
  draggedCard.column = targetColumn;
  const inTarget = cards.filter(c => c.column === targetColumn);
  if (position >= inTarget.length) {
    if (inTarget.length === 0) {
      cards.push(draggedCard);
    } else {
      const lastInCol = inTarget[inTarget.length - 1];
      const lastIdx = cards.findIndex(c => c.id === lastInCol.id);
      cards.splice(lastIdx + 1, 0, draggedCard);
    }
  } else {
    const beforeCard = inTarget[position];
    const beforeIdx = cards.findIndex(c => c.id === beforeCard.id);
    cards.splice(beforeIdx, 0, draggedCard);
  }
}

// #233 — move a card one column left (-1) or right (+1) by column order. Mirrors
// the drag-drop persist path (undo + local + JSON sync + render). No-op at the
// ends or on an unknown column. Appends to the bottom of the target column.
function moveCardColumn(cardId, dir) {
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const ord = [...columns].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const idx = ord.findIndex(c => c.id === card.column);
  const targetIdx = idx + dir;
  if (idx < 0 || targetIdx < 0 || targetIdx >= ord.length) return;
  pushUndoEntry(card);
  _insertCardAtPosition(card, ord[targetIdx].id, Infinity);
  card.updatedAt = new Date().toISOString();
  saveToLocalStorage();
  saveToJSONFile();
  _testHookMarkSaved();
  renderBoard();
}

function handleDragOver(e) {
  e.preventDefault(); // Required to allow drop
  e.dataTransfer.dropEffect = 'move';
  const column = e.target.closest('.column');
  if (!column) return;

  if (draggedColumnId) {
    // Column drag: insertion line on the appropriate edge, NO whole-column highlight
    document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
    const side = _computeColumnInsertionSide(column, e.clientX);
    _showColumnInsertionIndicator(column, side);
  } else {
    // Card drag (or other): keep the existing whole-column highlight AND show
    // the card insertion indicator if we have a cursor Y to position it by.
    document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
    column.classList.add('drag-over');
    if (draggedCardId && typeof e.clientY === 'number' && e.clientY > 0) {
      const body = column.querySelector('.column-body');
      if (body) {
        const { beforeEl } = _computeCardInsertionPosition(body, e.clientY);
        _showCardInsertionIndicator(body, beforeEl);
      }
    }
  }
}

function handleDragLeave(e) {
  const column = e.target.closest('.column');
  if (column && !column.contains(e.relatedTarget)) {
    column.classList.remove('drag-over');
  }
}

function handleDrop(e) {
  e.preventDefault();

  // Column reorder drop (Card #41, side-aware per #49) — takes precedence when a column is dragged
  if (draggedColumnId) {
    const targetCol = e.target.closest('.column');
    if (targetCol) {
      const targetId = targetCol.id.replace('column-', '');
      const side = _computeColumnInsertionSide(targetCol, e.clientX);
      reorderColumn(draggedColumnId, targetId, side);
    }
    _clearInsertionIndicators();
    document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
    draggedColumnId = null;
    return;
  }

  const column = e.target.closest('.column');
  if (!column || !draggedCardId) return;

  const targetColumnId = column.id; // e.g. 'column-backlog'
  const targetColumn = targetColumnId.replace('column-', ''); // e.g. 'backlog'

  const card = cards.find(c => c.id === draggedCardId);
  if (card) {
    const now = new Date().toISOString();
    // Cursor-driven path engages only when clientY is a real positive value.
    // DragEvent({}) defaults to 0 — treat as "no cursor data" and fall through
    // to the legacy column-only update.
    if (typeof e.clientY === 'number' && e.clientY > 0) {
      const body = column.querySelector('.column-body');
      const { position } = _computeCardInsertionPosition(body, e.clientY);
      const currentInCol = cards.filter(c => c.column === card.column);
      const currentPos = currentInCol.findIndex(c => c.id === card.id);
      const noop = (card.column === targetColumn && currentPos === position);
      if (!noop) {
        pushUndoEntry(card);
        _insertCardAtPosition(card, targetColumn, position);
        card.updatedAt = now;
        saveToLocalStorage();
        saveToJSONFile();
        _testHookMarkSaved();
      }
    } else if (card.column !== targetColumn) {
      // Programmatic drop without cursor (legacy/tests): just update column.
      pushUndoEntry(card);
      card.column = targetColumn;
      card.updatedAt = now;
      saveToLocalStorage();
      saveToJSONFile();
      _testHookMarkSaved();
    }
  }

  // Clean up visual states
  _clearInsertionIndicators();
  document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
  document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
  draggedCardId = null;

  renderBoard();
}

function handleDragEnd(e) {
  // Clean up any remaining visual states
  document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
  document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
  _clearInsertionIndicators();
  draggedCardId = null;
  draggedColumnId = null;
}

// Attach drag listeners to the board (event delegation)

boardEl.addEventListener('dragstart', handleDragStart);
boardEl.addEventListener('dragover', handleDragOver);
boardEl.addEventListener('dragleave', handleDragLeave);

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  // Label filter toggle — fires from .label-tag on rendered cards
  // #498: the toggle-assignee / toggle-priority / toggle-label branches used to
  // live here, fired by chips on rendered cards. No element inside the board
  // carries those actions now — filtering is entered from the header control,
  // whose listener is below (this delegation is scoped to boardEl and would
  // never have seen it).

  // ShortId link click in description

    scrollToCardByShortId(shortId);

  // #303-4 — toggle the backlog "older" (stale) section open/closed.

    renderBoard();
    return;

  // #303-4 — collapse / expand a whole column (persisted per browser).

    saveCollapsedColumns();

    deleteColumn(btn.dataset.columnId);
    return;
  }

  const cardEl = btn.closest('.card');
  if (!cardEl) return;
  const cardId = cardEl.dataset.id;
  if (action === 'edit') {
    editCard(cardId);
  } else if (action === 'save-edit') {
    saveEdit(cardId);
  } else if (action === 'cancel-edit') {
    cancelEdit();
  } else if (action === 'toggle-desc') {
    // Toggle description collapse/expand

    if (descEl) {
      const isCollapsed = descEl.classList.toggle('collapsed');
      descEl.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      btn.textContent = isCollapsed ? 'Show more' : 'Show less';
    }
  } else if (action === 'move-left' || action === 'move-right') {
    moveCardColumn(cardId, action === 'move-right' ? 1 : -1);
  }
});

// ── Column Rename Handlers ──
boardEl.addEventListener('dblclick', (e) => {
  const header = e.target.closest('.column-header');
  if (!header) return;
  enterColumnRenameMode(header);
});

function enterColumnRenameMode(header) {
  const columnId = header.dataset.columnId;
  if (!columnId || !columnNames.hasOwnProperty(columnId)) return;
  const nameSpan = header.querySelector('.column-name-text');
  if (!nameSpan) return;
  const currentName = getColumnDisplayName(columnId);
  const emoji = COLUMN_EMOJI[columnId] || '📌';
  nameSpan.innerHTML = `<input class="column-rename-input" type="text" value="${escapeAttr(currentName)}" maxlength="50" />`;
  const input = header.querySelector('.column-rename-input');
  if (!input) return;
  input.focus();
  input.select();
  // Closure-scoped flag: Enter and Escape both remove the input from the DOM
  // (via commit/cancel → updateColumnHeader → innerHTML replacement), which
  // fires the blur listener after them. Without this flag the blur would
  // unconditionally commit, overriding an explicit cancel. (Card #43)
  let isFinalizing = false;
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      isFinalizing = true;
      commitColumnRename(header, columnId, input.value.trim());
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      isFinalizing = true;
      cancelColumnRename(header, columnId);
    }
  });
  input.addEventListener('blur', (ev) => {
    if (isFinalizing) return; // already handled by Enter or Escape; skip the redundant commit
    commitColumnRename(header, columnId, input.value.trim());
  });
}

function commitColumnRename(header, columnId, newName) {
  if (!newName) {
    cancelColumnRename(header, columnId);
    return;
  }
  columnNames[columnId] = newName;
  // Also update the canonical columns array entry (Card #48 fix — without
  // this, renames are lost on the next render that reads from the array,
  // including the initial render after a page reload).
  const col = columns.find(c => c.id === columnId);
  if (col) col.name = newName;
  saveColumnNamesToStorage();
  saveToJSONFile();
  _testHookMarkSaved();
  updateColumnHeader(columnId);
}

function cancelColumnRename(header, columnId) {
  updateColumnHeader(columnId);
}

// ── Custom Columns (Card #41) ──

// Add a new column to the board with name "New Column" and immediately enter rename mode.
function addColumn() {
  const id = `col-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
  const newCol = { id, name: 'New Column', order: columns.length };
  columns.push(newCol);
  syncColumnNamesFromColumns();
  saveColumnNamesToStorage();
  saveToJSONFile();
  _testHookMarkSaved();
  renderBoard();
  // Enter rename mode on the new column header
  const header = document.querySelector(`.column-header[data-column-id="${id}"]`);
  if (header) enterColumnRenameMode(header);
}

// Delete a column. If it has cards, they're moved to the Orphanage column
// (auto-created if absent, reused if already exists). Orphaned cards get a
// `sent-to-orphanage` label and a `previousColumn` field. Blocked when only
// one column remains (can't have a board with zero columns).
function deleteColumn(columnId) {
  if (columns.length <= 1) {
    console.warn('deleteColumn: cannot delete the last remaining column');
    return false;
  }
  const colIdx = columns.findIndex(c => c.id === columnId);
  if (colIdx < 0) return false;

  // Find cards in this column
  const orphanedCards = cards.filter(c => c.column === columnId);

  if (orphanedCards.length > 0) {
    // Ensure Orphanage column exists
    let orphanage = columns.find(c => c.id === 'orphanage');
    if (!orphanage) {
      orphanage = { id: 'orphanage', name: 'Orphanage', order: columns.length };
      columns.push(orphanage);
    }
    // Move cards
    orphanedCards.forEach(card => {
      card.previousColumn = card.column;
      card.column = 'orphanage';
      if (!card.labels) card.labels = [];
      if (!card.labels.includes('sent-to-orphanage')) {
        card.labels.push('sent-to-orphanage');
      }
      card.updatedAt = new Date().toISOString();
    });
  }

  // Remove the column from the array
  columns.splice(colIdx, 1);
  syncColumnNamesFromColumns();
  saveColumnNamesToStorage();
  saveToLocalStorage();
  saveToJSONFile();
  _testHookMarkSaved();
  renderBoard();
  return true;
}

// Enter column edit mode. Replaces the header content with rename input
// and a delete button. Save/Cancel are handled by the input's keydown
// (Enter saves, Esc cancels) and a separate delete button click handler.
function enterColumnEditMode(columnId) {
  const header = document.querySelector(`.column-header[data-column-id="${columnId}"]`);
  if (!header) return;
  header.classList.add('editing');
  const currentName = getColumnDisplayName(columnId);
  const nameSpan = header.querySelector('.column-name-text');
  if (!nameSpan) return;
  nameSpan.innerHTML = `<input class="column-rename-input" type="text" value="${escapeAttr(currentName)}" maxlength="50" /> <button class="column-delete-btn" data-action="delete-column" data-column-id="${escapeAttr(columnId)}" title="Delete column">🗑</button>`;
  const input = header.querySelector('.column-rename-input');
  if (!input) return;
  input.focus();
  input.select();
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      commitColumnRename(header, columnId, input.value.trim());
      header.classList.remove('editing');
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      cancelColumnRename(header, columnId);
      header.classList.remove('editing');
    }
  });
}

// ── Add Column button wiring (Card #41, updated for #45) ──
// Delegated handler — the button is now generated by renderBoard, not in
// static HTML, so a one-time getElementById('btn-add-column') at module
// load returned null. Delegation handles every render cycle.
document.addEventListener('click', (e) => {

// ── Add Card form: per-column + button (Card #46) ──
// One form wrapper exists in the DOM; it moves between column bodies based on
// which column's + button was clicked. `currentAddCardColumn` tracks where
// the form currently lives so handleAddCard knows what column to file the new
// card into, and renderBoard knows where to re-place the form on each render.
let currentAddCardColumn = 'backlog';
const formWrapper = document.getElementById('add-card-form-wrapper');

// Delegated click handler for all .btn-expand-form buttons across columns.
// Toggles the form open/closed if clicking the column where the form already
// lives; otherwise moves the form to the clicked column and opens it.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-expand-form');
  if (!btn) return;
  const colId = btn.dataset.columnId;
  if (!colId) return;
  const targetBody = document.getElementById(`${colId}-body`);
  if (!targetBody) return;
  const isCurrentlyHere = currentAddCardColumn === colId && formWrapper.classList.contains('expanded');
  if (isCurrentlyHere) {
    // Clicking the same column's + while form is open here = collapse
    formWrapper.classList.remove('expanded');
    btn.classList.remove('active');
    return;
  }
  // Move form to this column (if not already), set state, expand, focus
  if (formWrapper.parentNode !== targetBody) {
    targetBody.appendChild(formWrapper);
  }
  currentAddCardColumn = colId;
  // Remove .active from any previously-active + button, set on this one
  document.querySelectorAll('.btn-expand-form.active').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  formWrapper.classList.add('expanded');
  setTimeout(() => {
    const titleInput = document.getElementById('card-title');
    if (titleInput) titleInput.focus();
  }, 300);
});

// ── Form Handler ──
function handleAddCard() {
  const titleInput = document.getElementById('card-title');
  const descInput = document.getElementById('card-desc');
  const typeInput = document.getElementById('card-type');
  const priorityInput = document.getElementById('card-priority');
  const labelsInput = document.getElementById('card-labels');

  const title = titleInput.value.trim();
  if (!title) {
    titleInput.focus();
    titleInput.style.borderColor = '#f87171';
    setTimeout(() => { titleInput.style.borderColor = ''; }, 1500);
    return;
  }

  const labels = labelsInput.value
    .split(',')
    .map(l => l.trim())
    .filter(l => l.length > 0);

  // Read multi-select assignee checkboxes (#51). Empty selection → ['unassigned'].
  const checkedBoxes = document.querySelectorAll('#card-assignees-group input[type="checkbox"]:checked');
  let assignees = Array.from(checkedBoxes).map(cb => cb.value);
  if (assignees.length === 0) assignees = ['unassigned'];

  const priority = priorityInput.value || null;
  addCard(title, descInput.value, typeInput.value, assignees, labels, currentAddCardColumn, priority);
  renderBoard();

  // Reset form
  titleInput.value = '';
  descInput.value = '';
  typeInput.value = 'task';
  document.querySelectorAll('#card-assignees-group input[type="checkbox"]').forEach(cb => { cb.checked = false; });
  priorityInput.value = '';
  labelsInput.value = '';
  titleInput.focus();
}

// ── Event Listeners ──
document.getElementById('btn-add-card').addEventListener('click', handleAddCard);
document.getElementById('card-title').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); handleAddCard(); }
});

// Global Cmd+Z / Ctrl+Z → undoLastMove (#31).
// Skip when focus is in a text field so native browser undo handles it.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'z' || !(e.metaKey || e.ctrlKey) || e.shiftKey) return;
  const t = e.target;
  if (!t) return;
  const tag = t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
  e.preventDefault();
  undoLastMove();
});

// ── Autocomplete Label Typing ──
let autocompleteDropdown = null;
let highlightedIndex = -1;
let currentSuggestions = [];
let activeLabelInput = null;

function getAllLabels() {
  const labelSet = new Set();
  cards.forEach(card => {
    if (card.labels && Array.isArray(card.labels)) {
      card.labels.forEach(l => labelSet.add(l));
    }
  });
  return labelSet;
}

function getLabelSuggestions(input) {
  if (!input || input.length < 2) return [];
  const allLabels = getAllLabels();
  const lower = input.toLowerCase();
  return [...allLabels].filter(l => l.toLowerCase().startsWith(lower));
}

function createAutocompleteDropdown(inputEl, suggestions) {
  closeAutocompleteDropdown();
  const wrapper = inputEl.closest('.label-autocomplete-wrapper') || wrapInputForAutocomplete(inputEl);
  const dropdown = document.createElement('div');
  dropdown.className = 'label-autocomplete-dropdown';
  dropdown.style.width = inputEl.offsetWidth + 'px';
  if (suggestions.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'label-autocomplete-empty';
    empty.textContent = 'No match — press Enter to create';
    dropdown.appendChild(empty);
  } else {
    suggestions.forEach((label, idx) => {
      const item = document.createElement('div');
      item.className = 'label-autocomplete-item';
      item.textContent = label;
      item.dataset.index = idx;
      item.addEventListener('click', () => selectLabelSuggestion(label, inputEl));
      item.addEventListener('mouseenter', () => {
        highlightSuggestion(dropdown, idx);
      });
      dropdown.appendChild(item);
    });
  }
  wrapper.appendChild(dropdown);
  autocompleteDropdown = dropdown;
  highlightedIndex = -1;
  currentSuggestions = suggestions;
  activeLabelInput = inputEl;
}

function wrapInputForAutocomplete(inputEl) {
  const wrapper = document.createElement('div');
  wrapper.className = 'label-autocomplete-wrapper';
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  return wrapper;
}

function highlightSuggestion(dropdown, index) {
  const items = dropdown.querySelectorAll('.label-autocomplete-item');
  items.forEach((item, i) => {
    item.classList.toggle('highlighted', i === index);
  });
  highlightedIndex = index;
}

function selectLabelSuggestion(label, inputEl) {
  inputEl.value = label;
  closeAutocompleteDropdown();
  inputEl.dispatchEvent(new Event('change', { bubbles: true }));
}

function closeAutocompleteDropdown() {
  if (autocompleteDropdown && autocompleteDropdown.parentNode) {
    autocompleteDropdown.parentNode.removeChild(autocompleteDropdown);
  }
  autocompleteDropdown = null;
  highlightedIndex = -1;
  currentSuggestions = [];
  activeLabelInput = null;
}

function handleLabelInput(e) {
  const input = e.target;
  const value = input.value;
  if (value.length >= 2) {
    const suggestions = getLabelSuggestions(value);
    createAutocompleteDropdown(input, suggestions);
  } else {
    closeAutocompleteDropdown();
  }
}

function handleLabelKeydown(e) {
  if (!autocompleteDropdown) return;
  const items = autocompleteDropdown.querySelectorAll('.label-autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = highlightedIndex + 1;
    if (next < items.length) {
      highlightSuggestion(autocompleteDropdown, next);
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const next = highlightedIndex - 1;
    if (next >= 0) {
      highlightSuggestion(autocompleteDropdown, next);
    } else if (next < -1) {
      highlightSuggestion(autocompleteDropdown, items.length - 1);
    }
  } else if (e.key === 'Enter') {
    if (highlightedIndex >= 0 && highlightedIndex < items.length) {
      e.preventDefault();
      const label = currentSuggestions[highlightedIndex];
      selectLabelSuggestion(label, e.target);
    } else {
      closeAutocompleteDropdown();
    }
  } else if (e.key === 'Escape') {
    closeAutocompleteDropdown();
  }
}

function attachLabelAutocomplete(inputEl) {
  inputEl.addEventListener('input', handleLabelInput);
  inputEl.addEventListener('keydown', handleLabelKeydown);
  inputEl.addEventListener('blur', () => {
    setTimeout(closeAutocompleteDropdown, 150);
  });
}

// ── Relationship typeahead (Card #42) ──
// Triggered when typing # in a Relationships input. Shows a dropdown of matching
// cards (shortId + title). Arrow keys + Enter to select.
let _relTypeaheadHighlightIdx = -1;
function closeRelationshipTypeahead() {
  document.querySelectorAll('.relationship-typeahead').forEach(el => el.remove());
  _relTypeaheadHighlightIdx = -1;
}

function showRelationshipTypeahead(inputEl, currentValue) {
  closeRelationshipTypeahead();
  // Extract the partial reference being typed (after the last # in the value)
  const hashIdx = currentValue.lastIndexOf('#');
  if (hashIdx === -1) return;
  const fragment = currentValue.slice(hashIdx + 1).trim().toLowerCase();
  // Filter cards: match shortId prefix OR title substring
  const candidates = cards.filter(c => {
    if (typeof c.shortId !== 'number') return false;
    if (fragment === '') return true;
    const sidMatch = String(c.shortId).startsWith(fragment);
    const titleMatch = (c.title || '').toLowerCase().includes(fragment);
    return sidMatch || titleMatch;
  }).slice(0, 8); // cap to 8 suggestions
  if (candidates.length === 0) return;
  const dropdown = document.createElement('div');
  dropdown.className = 'relationship-typeahead';
  // Position below the input
  const rect = inputEl.getBoundingClientRect();
  dropdown.style.position = 'absolute';
  dropdown.style.left = rect.left + 'px';
  dropdown.style.top = (rect.bottom + window.scrollY) + 'px';
  dropdown.style.minWidth = rect.width + 'px';
  dropdown.style.zIndex = '10000';
  candidates.forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'relationship-typeahead-item';
    item.dataset.shortid = c.shortId;
    item.textContent = `#${c.shortId} — ${c.title}`;
    if (i === 0) item.classList.add('highlighted');
    item.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      _selectRelTypeaheadItem(inputEl, c.shortId);
    });
    dropdown.appendChild(item);
  });
  document.body.appendChild(dropdown);
  _relTypeaheadHighlightIdx = 0;
}

function _selectRelTypeaheadItem(inputEl, shortId) {
  const value = inputEl.value;
  const hashIdx = value.lastIndexOf('#');
  const before = hashIdx >= 0 ? value.slice(0, hashIdx) : value;
  inputEl.value = before + `#${shortId}, `;
  closeRelationshipTypeahead();
  inputEl.focus();
}

function _moveRelTypeaheadHighlight(direction) {
  const items = document.querySelectorAll('.relationship-typeahead-item');
  if (items.length === 0) return;
  if (_relTypeaheadHighlightIdx >= 0 && _relTypeaheadHighlightIdx < items.length) {
    items[_relTypeaheadHighlightIdx].classList.remove('highlighted');
  }
  _relTypeaheadHighlightIdx = (_relTypeaheadHighlightIdx + direction + items.length) % items.length;
  items[_relTypeaheadHighlightIdx].classList.add('highlighted');
}

function attachRelationshipTypeahead(inputEl) {
  if (!inputEl) return;
  inputEl.addEventListener('input', (e) => {
    showRelationshipTypeahead(inputEl, inputEl.value);
  });
  inputEl.addEventListener('keydown', (e) => {
    const items = document.querySelectorAll('.relationship-typeahead-item');
    if (items.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _moveRelTypeaheadHighlight(1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _moveRelTypeaheadHighlight(-1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (_relTypeaheadHighlightIdx >= 0 && _relTypeaheadHighlightIdx < items.length) {
        const shortId = parseInt(items[_relTypeaheadHighlightIdx].dataset.shortid, 10);
        _selectRelTypeaheadItem(inputEl, shortId);
      }
    } else if (e.key === 'Escape') {
      closeRelationshipTypeahead();
    }
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(closeRelationshipTypeahead, 150);
  });
}

// ── Conversations panel (#93) ──
// Board-level commons. Append-only, plain text, no markdown rendering yet.
// Open the panel → loadConversations() + start polling (#112) so messages
// from other agents appear without a manual refresh. Closing stops the poll.
const conversations = [];

// #128 — friendly timestamp formatter for the commons feed.
// opts.now / opts.timeZone / opts.locale are injectable for deterministic tests;
// production calls pass no opts so the viewer's browser locale/tz applies.
function formatTimestamp(iso, opts) {
  opts = opts || {};
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const now = opts.now ? new Date(opts.now) : new Date();
  const diffSec = Math.floor((now.getTime() - d.getTime()) / 1000);
  if (diffSec < 60) return 'just now';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + 'm ago';
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return diffHr + 'h ago';
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7) return diffDay + 'd ago';
  // Older than 7 days — absolute local date+time, viewer-local tz by default.
  return new Intl.DateTimeFormat(opts.locale || undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
    timeZone: opts.timeZone || undefined,
  }).format(d);
}

// #167 — Board auto-refresh. Poll loadFromJSONFile every 5s, signature-check
// to skip identical state, and defer the render pass while the user is
// actively editing (drag, inline edit, or typing in the add-card form).
// Filter state is module-scope and read by renderBoard(), so refresh
// naturally preserves the active filter view — no special handling needed.
const BOARD_POLL_INTERVAL_MS = 5000;
let _boardPollTimer = null;
let _boardRenderedSig = null;

function boardSignature(cardArr, colArr) {
  if (!Array.isArray(cardArr)) cardArr = [];
  if (!Array.isArray(colArr)) colArr = [];
  // Cards: count + max(updatedAt) covers add/remove (count) and edit (timestamp).
  let maxTs = '';
  for (const c of cardArr) {
    const ts = c.updatedAt || c.createdAt || '';
    if (ts > maxTs) maxTs = ts;
  }
  const cardSig = cardArr.length + ':' + maxTs;
  // Columns: id@order:name covers reorder and rename. Sorted for canonical form.
  const colSig = colArr.slice()
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
    .map(c => c.id + '@' + (c.order ?? 0) + ':' + (c.name || ''))
    .join('|');
  return cardSig + '||' + colSig;
}

function shouldSkipBoardRender() {
  if (draggedCardId !== null) return true;
  if (editingCardId !== null) return true;
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    const formWrapper = document.getElementById('add-card-form-wrapper');
    if (formWrapper && formWrapper.contains(active)) return true;
  }
  return false;
}

async function pollBoard() {
  // Race avoidance: if a local save is in flight, the server may still be
  // writing — skip this tick so we don't read pre-save state and overwrite
  // the local in-memory new state. The next tick catches up.
  if (_pendingSaves.length > 0) return;
  const data = await loadFromJSONFile();
  if (!data) return;  // network blip; try again next tick
  const newSig = boardSignature(data.cards, data.columns);
  if (newSig === _boardRenderedSig) return;  // nothing changed server-side
  if (shouldSkipBoardRender()) return;  // user is mid-action; defer until idle
  // Apply new state in place to preserve array identity for any references.
  cards.length = 0;
  data.cards.forEach(c => cards.push(c));
  if (Array.isArray(data.columns)) {
    columns.length = 0;
    data.columns.forEach(c => columns.push({ ...c }));
    syncColumnNamesFromColumns();
  }
  nextShortId = recomputeNextShortId(cards, data.nextShortId);
  _boardRenderedSig = newSig;
  renderBoard();
}

function startBoardPolling() {
  if (_boardPollTimer !== null) return;
  _boardPollTimer = setInterval(pollBoard, BOARD_POLL_INTERVAL_MS);
}

function stopBoardPolling() {
  if (_boardPollTimer !== null) {
    clearInterval(_boardPollTimer);
    _boardPollTimer = null;
  }
}

// Polling lifecycle (#112).
let _convsPollTimer = null;
let _convsRenderedSig = null;
const CONVS_POLL_INTERVAL_MS = 5000;

// Append-only feed — count + last id is a sufficient change key.
function conversationsSignature(convs) {
  if (!Array.isArray(convs) || convs.length === 0) return '0';
  return convs.length + ':' + (convs[convs.length - 1].id || '');
}

// #208/#210 — conversation feed cursors + paging state.
//   _lastConvTs   = newest loaded → the poll fetches ?since=this (incremental).
//   _oldestConvTs = oldest loaded → load-older fetches ?before=this (walk back).
let _lastConvTs = null;
let _oldestConvTs = null;
let _convsLoadingOlder = false;
let _convsReachedStart = false;   // true once load-older hits an empty page
let _convsScrollWired = false;
const CONVS_PAGE_SIZE = 50;       // #210 — recent window + load-older chunk size

function _newestConvTs() {
  return conversations.reduce(
    (m, c) => (c && typeof c.createdAt === 'string' && c.createdAt > m ? c.createdAt : m), '');
}
function _oldestLoadedTs() {
  return conversations.reduce(
    (m, c) => (c && typeof c.createdAt === 'string' && (m === '' || c.createdAt < m) ? c.createdAt : m), '');
}

// #210 — bounded initial load: pull only the recent window (not the whole
// history), render it, set both cursors, wire scroll-up-loads-older. The
// recurring 5s poll is pollConversations(); walking back is loadOlderConversations().
function loadConversations() {
  return fetch('/api/conversations?limit=' + CONVS_PAGE_SIZE)
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(convs => {
      conversations.length = 0;
      if (Array.isArray(convs)) convs.forEach(c => conversations.push(c));
      _lastConvTs = _newestConvTs() || null;
      _oldestConvTs = _oldestLoadedTs() || null;
      _convsReachedStart = false;   // unknown until load-older returns an empty page
      renderConversationsFeed();
      _wireConvsScroll();
    });
}

// #210 — walk backwards into history on demand (scroll-up). Fetches the page of
// messages just older than the oldest we hold, prepends them, advances the
// oldest cursor, stops when the server runs out. Full history stays reachable —
// nothing is ever lost, it's just not loaded until you ask for it.
function loadOlderConversations() {
  if (_convsLoadingOlder || _convsReachedStart || !_oldestConvTs) return Promise.resolve();
  _convsLoadingOlder = true;
  const url = '/api/conversations?before=' + encodeURIComponent(_oldestConvTs)
            + '&limit=' + CONVS_PAGE_SIZE;
  return fetch(url)
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(older => {
      if (!Array.isArray(older) || older.length === 0) { _convsReachedStart = true; return; }
      const have = new Set(conversations.map(c => c.id));
      const fresh = older.filter(c => c && c.id && !have.has(c.id));
      if (fresh.length === 0) { _convsReachedStart = true; return; }
      conversations.unshift(...fresh);
      _oldestConvTs = _oldestLoadedTs() || _oldestConvTs;
      if (older.length < CONVS_PAGE_SIZE) _convsReachedStart = true;
      prependConversations(fresh);
    })
    .finally(() => { _convsLoadingOlder = false; });
}

// #210 — load older history when the reader scrolls near the top of the feed.
function _wireConvsScroll() {
  if (_convsScrollWired) return;
  const feed = document.getElementById('convs-feed');
  if (!feed) return;
  feed.addEventListener('scroll', () => {
    if (feed.scrollTop < 80) loadOlderConversations();
  });
  _convsScrollWired = true;
}

function startConvsPolling() {
  if (_convsPollTimer !== null) return;  // already polling
  _convsPollTimer = setInterval(pollConversations, CONVS_POLL_INTERVAL_MS);
}

function stopConvsPolling() {
  if (_convsPollTimer !== null) {
    clearInterval(_convsPollTimer);
    _convsPollTimer = null;
  }
}

// #113 — only these render inline; everything else is a download link (matches
// the server's safe-serve policy exactly).
const INLINE_IMAGE_MIMES = new Set(['image/png', 'image/jpeg', 'image/gif', 'image/webp']);

function renderAttachmentList(attachments) {
  const wrap = document.createElement('div');
  wrap.className = 'conv-msg-attachments';
  attachments.forEach(a => {
    if (!a || typeof a.id !== 'string') return;
    const url = '/api/attachments/' + encodeURIComponent(a.id);
    if (INLINE_IMAGE_MIMES.has(a.mime)) {
      const img = document.createElement('img');
      img.className = 'conv-attach-img';
      img.loading = 'lazy';   // #208 — don't fetch/decode/hold image bytes until scrolled into view
      img.src = url;
      img.alt = a.name || 'image';   // property assignment — no XSS
      img.title = a.name || '';
      img.addEventListener('click', () => window.open(url, '_blank'));
      wrap.appendChild(img);
    } else {
      const link = document.createElement('a');
      link.className = 'conv-attach-link';
      link.href = url;
      link.download = a.name || 'file';
      link.textContent = '📎 ' + (a.name || 'attachment');   // textContent — no XSS
      wrap.appendChild(link);
    }
  });
  return wrap;
}

// #291 — linkify #NNN card references in a commons message body. Mirrors
// core/conversation-view.mjs tokenizeCardRefs (duplicated because this inline
// <script> is not a module and can't import it). On the board a ref click
// scrolls to the card IN PLACE via scrollToCardByShortId — no navigation.
// Built from text-nodes + <a> only (never innerHTML), preserving the
// XSS-safe-by-construction guarantee of the textContent path it replaces.
// #303-1 — render a commons message body as chat-minimal markdown (bold/italic/
// lists + clickable #NNN refs), via the shared renderChatMarkdown (escape-FIRST,
// so innerHTML is XSS-safe by construction — the same guarantee the wiki uses).
// The refs are rewired to scroll IN PLACE on the board (vs. navigating), which
// is the board panel's distinct behavior. Falls back to plain text if the module
// bridge hasn't loaded yet (a thin pre-interaction window; never a blank body).
function appendConvBody(container, text) {
  const src = text == null ? '' : String(text);
  if (typeof window.renderChatMarkdown === 'function') {
    container.innerHTML = window.renderChatMarkdown(src);
    container.querySelectorAll('a.cardref[data-shortid]').forEach((a) => {
      a.classList.add('conv-card-ref'); // inherit the board's ref styling
      a.addEventListener('click', (e) => { e.preventDefault(); scrollToCardByShortId(Number(a.dataset.shortid)); });
    });
  } else {
    container.textContent = src; // renderer not yet loaded — degrade to plain text
  }
}

// #208 — build one .conv-msg node. Extracted so the full render and the
// incremental append share exactly one rendering path.
function createConvMessageNode(c) {
  const msg = document.createElement('div');
  msg.className = 'conv-msg';
  msg.dataset.id = c.id;

  const meta = document.createElement('div');
  meta.className = 'conv-msg-meta';
  const author = document.createElement('span');
  author.className = 'conv-msg-author';
  author.textContent = c.author || 'unknown';
  const ts = document.createElement('span');
  ts.className = 'conv-msg-ts';
  ts.textContent = formatTimestamp(c.createdAt);
  ts.title = c.createdAt || '';
  meta.appendChild(author);
  meta.appendChild(ts);

  const body = document.createElement('div');
  body.className = 'conv-msg-body';
  appendConvBody(body, c.body || '');   // #291 — text-nodes + clickable #NNN refs (no innerHTML)

  msg.appendChild(meta);
  msg.appendChild(body);
  if (Array.isArray(c.attachments) && c.attachments.length) {
    msg.appendChild(renderAttachmentList(c.attachments));
  }
  return msg;
}

function _convsSorted() {
  return [...conversations].sort((a, b) =>
    (a.createdAt || '').localeCompare(b.createdAt || ''));   // chronological, newest last
}

function renderConversationsFeed() {
  const feed = document.getElementById('convs-feed');
  if (!feed) return;
  // Skip the rebuild when nothing changed AND the DOM already reflects it
  // (#112) — avoids thrashing the feed and yanking scroll position on every
  // poll. The childElementCount guard catches external clears (e.g. tests).
  const sig = conversationsSignature(conversations);
  const expectedNodes = conversations.length === 0 ? 1 : conversations.length;
  if (sig === _convsRenderedSig && feed.childElementCount === expectedNodes) return;
  _convsRenderedSig = sig;
  feed.innerHTML = '';
  if (conversations.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'convs-empty';
    empty.textContent = 'No conversations yet. Be the first.';
    feed.appendChild(empty);
    return;
  }
  _convsSorted().forEach(c => feed.appendChild(createConvMessageNode(c)));
  feed.scrollTop = feed.scrollHeight;  // newest into view
}

// #208 — incremental append: render only the given (already-deduped) new
// messages, preserving every existing node. Pins to the bottom only if the
// reader is already there, so catching up on history isn't yanked away.
function appendConversations(fresh) {
  const feed = document.getElementById('convs-feed');
  if (!feed) return;
  const emptyHint = feed.querySelector('.convs-empty');
  if (emptyHint) emptyHint.remove();
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  [...fresh]
    .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))
    .forEach(c => feed.appendChild(createConvMessageNode(c)));
  _convsRenderedSig = conversationsSignature(conversations);  // keep the skip-guard honest
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

// #210 — render older messages at the TOP, anchoring the viewport so the page
// doesn't jump while you read (content grows above the fold).
function prependConversations(fresh) {
  const feed = document.getElementById('convs-feed');
  if (!feed) return;
  const prevHeight = feed.scrollHeight;
  const prevTop = feed.scrollTop;
  const frag = document.createDocumentFragment();
  [...fresh]
    .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))
    .forEach(c => frag.appendChild(createConvMessageNode(c)));
  feed.insertBefore(frag, feed.firstChild);
  _convsRenderedSig = conversationsSignature(conversations);
  feed.scrollTop = prevTop + (feed.scrollHeight - prevHeight);   // keep the viewport put
}

// #208 — the recurring poll. Fetches only messages newer than the cursor
// (?since=), dedupes against what we already hold (since is >=, so the cursor
// message itself comes back), appends the genuinely-new ones, advances the
// cursor. Replaces "re-fetch + re-render the entire history every 5 seconds".
function pollConversations() {
  const url = _lastConvTs
    ? '/api/conversations?since=' + encodeURIComponent(_lastConvTs)
    : '/api/conversations';
  return fetch(url)
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(convs => {
      if (!Array.isArray(convs) || convs.length === 0) return;
      const have = new Set(conversations.map(c => c.id));
      const fresh = convs.filter(c => c && c.id && !have.has(c.id));
      if (fresh.length === 0) return;
      fresh.forEach(c => conversations.push(c));
      _lastConvTs = _newestConvTs() || _lastConvTs;
      appendConversations(fresh);
    });
}

async function postConversation(body, author, attachments) {
  const text = (body || '').trim();
  const atts = Array.isArray(attachments) ? attachments : [];
  if (!text && atts.length === 0) return false;   // body OR attachment required
  try {
    const res = await fetch('/api/conversations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: text, author, attachments: atts }),
    });
    if (!res.ok) return false;
    await loadConversations();
    return true;
  } catch (e) {
    return false;
  }
}

function toggleConvsPanel() {
  const panel = document.getElementById('convs-panel');
  if (!panel) return;
  const willOpen = !panel.classList.contains('visible');
  panel.classList.toggle('visible');
  const btn = document.getElementById('btn-toggle-convs');
  if (btn) btn.classList.toggle('active', willOpen);
  if (willOpen) {
    loadConversations();
    startConvsPolling();
  } else {
    stopConvsPolling();
  }
}

function closeConvsPanel() {
  const panel = document.getElementById('convs-panel');
  if (panel) panel.classList.remove('visible');
  const btn = document.getElementById('btn-toggle-convs');
  if (btn) btn.classList.remove('active');
  stopConvsPolling();
}

// Wire events
const _convsToggleBtn = document.getElementById('btn-toggle-convs');
if (_convsToggleBtn) _convsToggleBtn.addEventListener('click', toggleConvsPanel);

const _convsCloseBtn = document.getElementById('btn-close-convs');
if (_convsCloseBtn) _convsCloseBtn.addEventListener('click', closeConvsPanel);

// #113 — attachments uploaded and awaiting send with the next post.
let _pendingAttachments = [];

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result);
      const comma = s.indexOf(',');
      resolve(comma >= 0 ? s.slice(comma + 1) : s);   // strip the data: URL prefix
    };
    r.onerror = () => reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

function renderPendingAttachments() {
  const el = document.getElementById('convs-attachments');
  if (!el) return;
  el.innerHTML = '';
  _pendingAttachments.forEach((a, i) => {
    const chip = document.createElement('span');
    chip.className = 'conv-attach-chip';
    const label = document.createElement('span');
    label.textContent = a.name;   // textContent — no XSS
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '×';
    rm.title = 'Remove';
    rm.addEventListener('click', () => { _pendingAttachments.splice(i, 1); renderPendingAttachments(); });
    chip.appendChild(label);
    chip.appendChild(rm);
    el.appendChild(chip);
  });
}

async function uploadCommonsFile(file) {
  if (!file) return;
  try {
    const data = await fileToBase64(file);
    const res = await fetch('/api/attachments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: file.name || 'pasted', mime: file.type || 'application/octet-stream', data }),
    });
    if (!res.ok) {
      let msg = res.status;
      try { msg = (await res.json()).error || msg; } catch (e) { /* keep status */ }
      // Non-blocking on purpose: a native alert() freezes the page for an agent
      // driving this board through a browser — every subsequent command times
      // out and Escape can't reach the dialog. On a board whose whole premise is
      // that agents and people use the same UI, a modal is an outage for half
      // the room. The toast already exists; use it.
      showUndoToast('Attachment rejected: ' + msg);
      return;
    }
    _pendingAttachments.push(await res.json());
    renderPendingAttachments();
  } catch (e) {
    showUndoToast('Upload failed: ' + (e && e.message ? e.message : e));
  }
}

const _convsForm = document.getElementById('convs-form');
if (_convsForm) {
  _convsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const bodyEl = document.getElementById('convs-body');
    const authorEl = document.getElementById('convs-author');
    const body = bodyEl ? bodyEl.value : '';
    const author = authorEl ? authorEl.value : '';
    if ((!body || !body.trim()) && _pendingAttachments.length === 0) return;  // body OR attachment
    const ok = await postConversation(body, author, _pendingAttachments);
    if (ok) {
      if (bodyEl) bodyEl.value = '';
      _pendingAttachments = [];
      renderPendingAttachments();
    }
  });

  // File picker
  const _fileInput = document.getElementById('convs-file');
  const _attachBtn = document.getElementById('btn-attach-conv');
  if (_attachBtn && _fileInput) {
    _attachBtn.addEventListener('click', () => _fileInput.click());
    _fileInput.addEventListener('change', async () => {
      for (const f of Array.from(_fileInput.files || [])) await uploadCommonsFile(f);
      _fileInput.value = '';
    });
  }

  // Paste (clipboard images — the "clutch" flow)
  const _bodyEl = document.getElementById('convs-body');
  if (_bodyEl) {
    _bodyEl.addEventListener('paste', async (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      const files = [];
      for (const it of items) {
        if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
      }
      if (files.length) {
        e.preventDefault();
        for (const f of files) await uploadCommonsFile(f);
      }
    });
  }

  // Drag & drop
  _convsForm.addEventListener('dragover', (e) => { e.preventDefault(); _convsForm.classList.add('dragover'); });
  _convsForm.addEventListener('dragleave', () => _convsForm.classList.remove('dragover'));
  _convsForm.addEventListener('drop', async (e) => {
    e.preventDefault();
    _convsForm.classList.remove('dragover');
    for (const f of Array.from((e.dataTransfer && e.dataTransfer.files) || [])) await uploadCommonsFile(f);
  });
}

// ── Initial Render ──
// On page load: try JSON file first, fall back to localStorage
(async function initBoard() {
  // Fill the assignee pickers from the roster BEFORE anything renders. The
  // roster is inlined into the page by the server, so this is synchronous —
  // fetching it here would leave a gap in which the pickers show nothing and
  // then pop, which reads as a bug.
  populateRosterUI();

  const jsonResult = await loadFromJSONFile();
  if (jsonResult && jsonResult.cards && jsonResult.cards.length > 0) {
    cards.length = 0;
    jsonResult.cards.forEach(c => cards.push(c));
    // Restore columns from JSON if present
    if (Array.isArray(jsonResult.columns) && jsonResult.columns.length > 0) {
      columns.length = 0;
      jsonResult.columns.forEach(c => columns.push({ ...c }));
      syncColumnNamesFromColumns();
    }
    nextShortId = recomputeNextShortId(cards, jsonResult.nextShortId);
    saveToLocalStorage();
  } else {
    restoreFromLocalStorage();
    nextShortId = recomputeNextShortId(cards, null);
    saveToJSONFile();
  }
  // Ensure columns has at least the defaults (no-op if already populated above)
  migrateColumnsIfNeeded();
  // Migrate any legacy relatedCards (UUID array) → relationships.relatedTo (shortId array)
  migrateRelationshipsIfNeeded();
  // Migrate legacy singular assignee field → assignees array (#51)
  migrateAssigneesIfNeeded();
  // Migrate legacy priority prefixes in title (e.g. '🔴 P0:') → priority field
  migratePrioritiesIfNeeded();
  renderBoard();
  // #291 — deep-link from a commons #NNN ref: once the board is rendered, scroll
  // to ?card=NNN (no-ops gracefully if the id is unknown or absent).
  try {
    const _cardParam = new URLSearchParams(window.location.search).get('card');
    if (_cardParam && /^\d+$/.test(_cardParam)) scrollToCardByShortId(Number(_cardParam));
  } catch (_) { /* deep-link is best-effort */ }
  // #167 — Seed the signature with the rendered state and start polling.
  // The signature short-circuit then skips the first poll tick (no change).
  _boardRenderedSig = boardSignature(cards, columns);
  if (!_IS_TEST_MODE) startBoardPolling();
})();
</script>
