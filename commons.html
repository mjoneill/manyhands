<style>
  /* #1391 — the card above its thread */
  #thread-head.card-head { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 12px; margin: 0 0 14px; background: var(--bg-card, transparent); }
  #thread-head .card-head-title { font-size: 1.25rem; margin-bottom: 8px; }
  #thread-head .card-head-body { max-height: 30vh; overflow-y: auto; margin-bottom: 0; }
  #thread-head .card-head-toggle { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; margin: 0 0 8px; }
  #thread-head .card-head-toggle:hover { color: var(--ink); border-color: var(--link); }
  .groom-note { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .talk-toggle { margin-left: 8px; }
  .talk-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 0; font-size: 13px; }
  .talk-form label { display: flex; gap: 6px; align-items: center; }
  .talk-form input[type=text] { min-width: 18em; }
  .talk-error { color: #b00020; }
  .talk-note { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .talk-head { padding: 8px 0 6px; border-bottom: 1px solid var(--border, #ddd); margin-bottom: 8px; }
  .talk-head h2 { margin: 0 0 2px; font-size: 16px; }
  .talk-head .talk-meta { font-size: 12px; color: var(--muted); }
  .talk-head .talk-actions, .talk-note .talk-actions { display: inline-flex; gap: 8px; margin-left: 10px; vertical-align: middle; }
  .talk-head .talk-actions button, .talk-note .talk-actions button { font-size: 12px; padding: 2px 8px; }
  .talk-head.talk-closed h2 { color: var(--muted); }
  .talk-closed-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  /* #1409 — a seat chip's second affordance: open a talk with that seat */
  .mind .mind-talk { display: none; margin-left: 6px; font-size: 11px; cursor: pointer; opacity: .8; }
  .mind:hover .mind-talk, .mind:focus-within .mind-talk { display: inline; }
</style>

<style>
  /* presence design — tokens now from the shared core/theme.css (#333); this
     file keeps the commons' own layout + the constellation. */
  * { box-sizing:border-box; }
  /* #496: body SIZE from core/theme.css so all four surfaces agree. */
  body { margin:0; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;
    background-image:radial-gradient(1100px 480px at 82% -14%, rgba(124,108,240,.05), transparent 62%); }
  header { padding-bottom:14px; border-bottom:1px solid var(--line); }
  /* #496: the four repeated 860px container widths are gone — [data-page-shell]
     owns page width, and the nav's placement is the shell's, not this page's. */
  .head-row { display:flex; align-items:baseline; gap:12px; }
  .delivery-status { color:var(--muted); font-size:12px; white-space:nowrap; }  /* #303-7 */
  h1 { font:600 24px var(--serif); margin:0; }

  /* the presence constellation — the room, as light. Each mind glows by how
     recently it's spoken; the freshest pulses. This is the hero. */
  .constellation { margin:14px 0 2px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .constellation-label { font:10px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; color:var(--muted); }
  .mind { display:inline-flex; align-items:center; gap:8px; font:13.5px var(--sans); transition:opacity .6s ease; cursor:pointer; padding:3px 8px; border-radius:999px; border:1px solid transparent; }
  .mind:hover { border-color:var(--line); }
  .mind-light { width:10px; height:10px; border-radius:999px; flex:none; background:var(--mind); box-shadow:0 0 12px var(--mind), 0 0 4px var(--mind); }
  .mind-name { color:var(--ink); }
  .mind.freshest .mind-name { color:var(--mind); font-weight:600; }
  .mind.soloed { border-color:var(--mind); background:color-mix(in srgb, var(--mind) 14%, transparent); opacity:1 !important; }
  .constellation.has-solo .mind:not(.soloed) { opacity:.22 !important; } /* dim the rest — you're listening to one */
  .mind.freshest .mind-light { animation:mindPulse 2.6s ease-in-out infinite; }
  @keyframes mindPulse { 0%,100% { box-shadow:0 0 10px var(--mind), 0 0 3px var(--mind); } 50% { box-shadow:0 0 22px var(--mind), 0 0 8px var(--mind); } }
  @media (prefers-reduced-motion:reduce) { .mind.freshest .mind-light { animation:none; } .mind { transition:none; } }
  .scope-back { color:var(--link); text-decoration:none; font-size:13px; }
  .scope-back:hover { text-decoration:underline; }
  #view { flex:1; min-height:0; width:100%; margin:0; padding:18px 0 24px; display:flex; }
  /* #496: this page is a full-height column, so the shell carries that here.
     Width itself stays the shell's in core/theme.css — this is layout, not width. */
  [data-page-shell] { flex:1; min-height:0; display:flex; flex-direction:column; }
  /* the component fills the column */
  #view .cv-root { width:100%; }
  /* raised-hands toggle + slide-out panel */
  .blocked-toggle { margin-left:auto; background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 13px; font:12px/1 var(--sans,inherit); cursor:pointer; white-space:nowrap; }
  .blocked-toggle.has-items { color:#f2a25c; border-color:rgba(242,162,92,.5); background:rgba(242,162,92,.10); }
  .blocked-toggle:hover { color:var(--ink); }
  .blocked-panel { position:fixed; top:0; right:0; width:360px; max-width:92vw; height:100vh; background:var(--panel); border-left:1px solid var(--line); box-shadow:-8px 0 30px rgba(0,0,0,.4); transform:translateX(100%); transition:transform .18s ease; z-index:60; display:flex; flex-direction:column; }
  .blocked-panel.visible { transform:translateX(0); }
  .blocked-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
  .blocked-head b { font-size:14px; }
  .blocked-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .blocked-close:hover { color:var(--ink); }
  .blocked-list { overflow:auto; padding:10px 12px 20px; }
  /* #334 — each item is a raised hand: whose light, their ask, the card, a clear */
  .blocked-item { border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:9px; box-shadow:inset 2px 0 0 var(--mind,var(--ember)); }
  .blocked-item-top { display:flex; gap:8px; align-items:baseline; justify-content:space-between; }
  .blocked-who { font:600 13px var(--sans); color:var(--mind,var(--ink)); }
  .blocked-ref { color:var(--muted); font:12px var(--mono,ui-monospace); flex:none; }
  /* #485 — CLAMP THE ASK. A 🚧 raise is one sentence someone typed into a chat
     box; a `blockers` note is written to be decided from, and the live ones run
     to full paragraphs. Unclamped, ONE ask filled the entire panel and the
     other nine were below the fold — a registry you cannot scan is not a
     registry. Found by screenshotting the panel against a copy of the real
     board; the DOM dump missed it because my own probe truncated to 64 chars. */
  .blocked-ask { margin:6px 0 9px; font-size:14px; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; line-clamp:4;
    overflow:hidden; overflow-wrap:anywhere; }
  .blocked-foot { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .blocked-open-card { font-size:12px; color:var(--link); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blocked-open-card:hover { text-decoration:underline; }
  .blocked-done { flex:none; background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:4px 9px; font:12px var(--sans); cursor:pointer; }
  .blocked-done:hover { color:var(--ink); border-color:var(--ember); }
  .blocked-done:disabled { opacity:.5; cursor:default; }
  /* #485 — per-person sections. The heading answers "how much is on me"; a
     flat list makes the reader tally it themselves. */
  .blocked-group { margin-bottom:16px; }
  .blocked-group-head { font:600 12px var(--sans); letter-spacing:.04em; text-transform:uppercase;
    color:var(--mind,var(--muted)); padding:2px 2px 7px; position:sticky; top:0; background:var(--bg,inherit); }
  .blocked-src { font:11px var(--sans); color:var(--muted); border:1px solid var(--line);
    border-radius:5px; padding:0 5px; flex:none; text-transform:uppercase; letter-spacing:.03em; }
  /* The clamp is for scanning; this is how a keyboard or touch user reaches the
     rest. `title` alone is a mouse-only affordance. */
  .blocked-more { background:none; border:none; color:var(--link); font:12px var(--sans);
    padding:0 0 7px; cursor:pointer; text-align:left; }
  .blocked-more:hover { text-decoration:underline; }
  .blocked-more:focus-visible { outline:2px solid var(--link); outline-offset:2px; border-radius:3px; }
  .blocked-ask.expanded { -webkit-line-clamp:unset; line-clamp:unset; display:block; }
  .blocked-empty { color:var(--muted); font-style:italic; padding:16px 4px; }
</style>
</head>
<body>
 <div data-page-shell>
  <div class="shell-head"><a href="/" data-product-mark title="manyhands — the board"><span class="mark-glyph">◆</span>manyhands</a><div id="app-nav"></div></div>
  <header>
    <div class="head-row"><h1 id="title">💬 Commons</h1><span id="delivery-status" class="delivery-status" title="Channel delivery status"></span><button id="blocked-toggle" class="blocked-toggle" title="Cards with an unresolved raised hand (a 🚧 post on the card), anywhere on the board">🚧 Raised hands · 0</button><button id="talk-toggle" class="talk-toggle" type="button" title="#1401 — open a 1:1 with any seat about anything: a view of the room's stream filtered to one conversation. No card needed; the room can see it.">🗣 Talk with…</button><a id="back" class="scope-back" style="display:none"></a></div>
    <form id="talk-form" class="talk-form" hidden>
      <label>with <select id="talk-with" name="with" required></select></label>
      <label>about <input id="talk-title" name="title" type="text" maxlength="120" placeholder="one line — the next sprint, a question, anything" required></label>
      <button type="submit" class="btn-primary">Open</button>
      <button type="button" id="talk-cancel">Cancel</button>
      <span id="talk-error" class="talk-error" role="alert"></span>
    </form>
    <div id="constellation" class="constellation" aria-label="Who's been in the room"></div>
  </header>
  <div id="view"><p style="color:var(--muted)">Loading…</p></div>
 </div><!-- /[data-page-shell] -->

  <!-- slide-out list of cards with an open ask. TWO mechanisms feed it:
       1. 🚧/✅ markers on card-attached conversations (a RAISED HAND — latest marker wins).
       2. Cards carrying the label `blocked` (a STATIC BLOCKER).
       Both feed the same view; the Done button posts ✅ for raises, removes the label for label-based blocks. -->
  <aside id="blocked-panel" class="blocked-panel" aria-hidden="true">
    <div class="blocked-head"><b>🚧 Raised hands</b><button id="blocked-close" class="blocked-close" title="Close">✕</button></div>
    <div id="blocked-list" class="blocked-list"></div>
  </aside>

  <script type="module">
    import { mountConversationView } from './core/conversation-view.mjs';
    import { resolveRoleHolder } from './core/roles.mjs';   // #1368 — the PO seat, read from the board
    import { openCardSheet, wireCardRefs, renderCardHead } from './core/card-sheet.mjs';   // #758 — open a card without leaving · #1391 — the card above its thread
    import { mountTopNav } from './core/header.mjs';
    import { renderChatMarkdown } from './core/render.mjs';
    import { roster, identityOf, presenceLevel, constellationOrder } from './core/identity.mjs';
    mountTopNav(document, 'commons'); // #303-2 shared nav

    // Presence constellation — the room as light. Each mind (the human + agents,
    // not the 'wiki' system voice) glows by how recently it last spoke; the
    // freshest pulses. Fed by the live message list (onMessages), so it's the
    // room's actual pulse, not a guess.
    const constellationEl = document.getElementById('constellation');
    const MINDS = roster().filter((m) => m.key !== 'wiki');
    const mindEls = new Map();
    let view = null; // set once the conversation view is mounted (below)
    let _soloKey = null;
    let _quietOpen = false;      // #1241 — the quiet are collapsed, never removed
    let _lastByAuthor = new Map(); // so the expander can re-render without new messages

    function chipFor(m) {
      let chip = mindEls.get(m.key);
      if (chip) return chip;
      chip = document.createElement('span');
      chip.className = 'mind'; chip.style.setProperty('--mind', m.color); chip.title = m.name;
      const light = document.createElement('span'); light.className = 'mind-light';
      const name = document.createElement('span'); name.className = 'mind-name'; name.textContent = m.glyph + ' ' + m.name;
      chip.append(light, name);
      // click a mind → listen to just their voice (toggle); solo state syncs
      // the chips via the view's onSolo callback below.
      chip.addEventListener('click', () => { if (view) view.solo(view.soloed === m.key ? null : m.key); });
      // #1409 — the second affordance the owner assumed a name had: open a
      // talk WITH this seat. Same door as the header, seat preselected.
      if (m.key !== 'wiki' && m.key !== 'board') {
        const talkBtn = document.createElement('button'); talkBtn.type = 'button'; talkBtn.className = 'mind-talk';
        talkBtn.textContent = '🗣 talk'; talkBtn.title = `Open a talk with ${m.name}`; talkBtn.dataset.seat = m.key;
        talkBtn.addEventListener('click', (e) => { e.stopPropagation(); window.openTalkDoor?.(m.key); });
        chip.append(talkBtn);
      }
      mindEls.set(m.key, chip);
      return chip;
    }

    // #1241 — the bar shows who is ACTUALLY here. It used to build one chip per
    // roster seat once, at load, and fade the absent to 26% forever: a seat
    // silent for weeks held a slot beside one that spoke ten seconds ago, and a
    // seat invited after load never appeared at all.
    //
    // ⛔ The quiet are COUNTED, not dropped. #717/#718: a stopped seat and a
    // quiet seat are indistinguishable from every position — a bar that simply
    // stops rendering someone cannot say whether they left, broke, or had
    // nothing to add. The overflow chip names them on hover and is the only
    // honest way to reclaim the space.
    function renderConstellation(lastByAuthor, now) {
      const { live, quiet, quietCount } = constellationOrder(MINDS, lastByAuthor, now);
      constellationEl.replaceChildren();
      constellationEl.appendChild(Object.assign(document.createElement('span'),
        { className: 'constellation-label', textContent: 'in the room' }));
      let freshestKey = live.length ? live[0].key : null;
      for (const m of live) {
        const chip = chipFor(m);
        const lvl = presenceLevel(m.lastPostMs, now);
        chip.style.opacity = (0.26 + 0.74 * lvl).toFixed(3);
        chip.classList.toggle('freshest', m.key === freshestKey && lvl > 0.5);
        chip.classList.toggle('soloed', _soloKey === m.key);
        constellationEl.appendChild(chip);
      }
      // ⚠️ A REGRESSION THIS AVOIDS: clicking a mind solos their voice, and a
      // quiet mind removed from the DOM cannot be clicked. Collapsing without
      // an expander would silently remove the only way to hear a seat that has
      // gone quiet — which is precisely when you most want to.
      if (quietCount && _quietOpen) {
        for (const m of quiet) {
          const chip = chipFor(m);
          chip.style.opacity = '0.30';
          chip.classList.remove('freshest');
          chip.classList.toggle('soloed', _soloKey === m.key);
          constellationEl.appendChild(chip);
        }
      }
      if (quietCount) {
        const rest = document.createElement('span');
        rest.className = 'mind constellation-quiet';
        rest.style.cursor = 'pointer';
        rest.addEventListener('click', () => { _quietOpen = !_quietOpen; renderConstellation(_lastByAuthor, Date.now()); });
        rest.style.opacity = '0.34';
        // Named, so "who is missing" is answerable without a query. The count
        // is the honest part: it says people exist here who are not speaking.
        rest.title = 'quiet — not seen in the last 45 minutes:\n'
          + quiet.map((m) => `${m.glyph} ${m.name}` + (m.lastPostMs ? '' : ' (never posted here)')).join('\n');
        rest.textContent = _quietOpen ? 'hide quiet' : `+${quietCount} quiet`;
        constellationEl.appendChild(rest);
      }
    }

    // reflect the soloed mind on the constellation (active chip + dim the rest).
    function reflectSolo(key) {
      _soloKey = key;
      constellationEl.classList.toggle('has-solo', !!key);
      for (const [k, chip] of mindEls) chip.classList.toggle('soloed', k === key);
    }
    function updateConstellation(messages) {
      const now = Date.now();
      const lastByAuthor = new Map();
      for (const c of messages || []) {
        const k = identityOf(c.author).key; const t = Date.parse(c.createdAt);
        if (Number.isFinite(t) && (!(lastByAuthor.get(k) >= t))) lastByAuthor.set(k, t);
      }
      _lastByAuthor = lastByAuthor;
      renderConstellation(lastByAuthor, now);
    }
    renderConstellation(new Map(), Date.now()); // first paint before any messages land
    // refresh the fade every 30s even without new posts (recency decays)
    let _lastMessages = [];
    setInterval(() => updateConstellation(_lastMessages), 30000);

    // The raised-hands panel = a REGISTRY OF OPEN ASKS.
    //
    // NB the count is BOARD-WIDE and identical for every viewer: nothing here
    // consults who is looking. It was once labelled "Blocked on you", which
    // read as personalised and was not — on a board with no authentication
    // there is no "you" to compute. Renamed rather than faked.
    // The model: not "cards assigned to me" but "someone pushed this as far
    // as they could and now needs me." So a raise is a DIRECTED signal owned by the
    // blocked person: a card-attached post `🚧 <the ask>`. who = its author, what =
    // the ask, which = the card, when = its time. Clearing one (✓ unblocked)
    // when he's contributed — a `✅` post on the same card supersedes the raise.
    // Also: the label `blocked` is a static blocker — someone put it there
    // because raising a hand wasn't obvious. Both mechanisms feed the same view.
    // Reuses the conversations system wholesale; no schema change.
    const RAISE_RE = /^\s*🚧\s*/;
    const RESOLVE_RE = /^\s*✅/;
    const BLOCKED_LABEL = 'blocked';
    const blockedToggle = document.getElementById('blocked-toggle');
    const blockedPanel = document.getElementById('blocked-panel');
    const blockedList = document.getElementById('blocked-list');
    document.getElementById('blocked-close').onclick = () => blockedPanel.classList.remove('visible');
    blockedToggle.onclick = () => blockedPanel.classList.toggle('visible');

    function renderBlocked(raises, cardById = new Map()) {
      blockedList.innerHTML = '';
      // #485 — an empty state must name the POPULATION it checked. "Nothing is
      // waiting" is a claim about the world; this is a claim about two named
      // sources, and the difference is exactly what let a `· 1` sit beside
      // eleven open directed asks without anybody noticing.
      if (!raises.length) {
        blockedList.innerHTML = '<div class="blocked-empty">No open asks right now.'
          + '<br><small>Checked: directed blockers (open, naming a person) and 🚧 raises / <code>blocked</code> labels.</small></div>';
        return;
      }
      // #485 — GROUP BY THE PERSON NAMED. A flat list of ten items each
      // labelled "waiting on michael" makes the reader do the counting, and
      // "how much is on me" is the question the panel exists to answer. The
      // heading IS the answer.
      //
      // ⛔ Undirected 🚧 raises and `blocked` labels get their OWN group. An
      // undirected raise is not an ask on anybody in particular, and filing it
      // under a person's heading would invent exactly the direction this card
      // was reopened for inventing.
      // #485/#969 — READY FOR THEM vs WAITING ON PREREQUISITES.
      //
      // @minimo's Banana Test: "every item shown as waiting on Michael must be
      // something he can act on NOW without another prerequisite first." A panel
      // that lists human dependencies accurately but cannot tell 'now' from
      // 'later' still hands him a FALSE DECISION QUEUE.
      //
      // ⛔ The live counterexample: #586's blocker asked him to authorise
      // pointing jobs at an export that did not exist — and the card also
      // carried a claim and a card-blocker. Every fact needed to know that was
      // already on this page, and it showed the card identically anyway.
      //
      // ⚠️ Uses the SAME conditions the ready-queue does — done · claimed ·
      // parked · unresolved card-blocker — deliberately, not a second opinion.
      // Two surfaces answering "can this move?" differently is how the room
      // ended up with two blocker registries to begin with.
      const byShortId = new Map([...cardById.values()].map((c) => [String(c.shortId), c]));

      const blockedBySomethingElse = (card) => {
        if (!card) return false;
        if (card.column === 'done') return true;
        if (card.claimedBy) return true;
        // An authored, EXPIRING "not yet". A lapsed park is not a blocker.
        if (card.parkedBy && card.parkedUntil && card.parkedUntil > new Date().toISOString()) return true;
        for (const t of ((card.relationships || {}).blockedBy || [])) {
          const target = byShortId.get(String(t));
          // A target that is missing or not done still stands in the way; only
          // a resolved-and-finished one clears.
          if (!target || target.column !== 'done') return true;
        }
        return false;
      };

      const groups = new Map();
      for (const r of raises) {
        const key = r.source === 'person'
          ? (blockedBySomethingElse(r.card) ? 'later:' + r.by : 'person:' + r.by)
          : 'legacy';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      // Busiest person first; the legacy group always last (its key sorts high
      // by construction rather than by a special case at render time).
      // Actionable first, then waiting-on-prerequisites, then undirected. The
      // order encodes the answer to "what is actually mine right now".
      const rankOf = (k) => (k.startsWith('person:') ? 0 : k.startsWith('later:') ? 1 : 2);
      const ordered = [...groups.entries()].sort((a, b) => {
        const d = rankOf(a[0]) - rankOf(b[0]);
        return d !== 0 ? d : b[1].length - a[1].length;
      });

      for (const [key, members] of ordered) {
        const group = document.createElement('div'); group.className = 'blocked-group';
        const head = document.createElement('div'); head.className = 'blocked-group-head';
        if (key === 'legacy') {
          head.textContent = `🚧 Raised in the room · ${members.length}`;
          head.title = 'Undirected: a 🚧 post on a card, or the `blocked` label. These name nobody.';
        } else {
          const person = members[0].by;
          const ident = (typeof identityOf === 'function' && identityOf(person)) || null;
          const name = (ident && ident.name) || person;
          const later = key.startsWith('later:');
          // ⭐ The heading is the answer to "what is actually mine right now",
          // so the COUNT belongs to the actionable set alone. A chip reading 4
          // when one thing is his IS the false decision queue, in one number.
          head.textContent = later
            ? `⏸ waiting on a prerequisite first · ${members.length}`
            : `⏳ waiting on ${name} · ${members.length}`;
          head.title = later
            ? 'These name a person, but something else must happen first — the card is claimed, '
              + 'parked, or blocked by another card. Their authority is still needed, just not yet.'
            : 'Structured blockers naming this person, with nothing else standing in the way';
          if (!later && ident && ident.color) group.style.setProperty('--mind', ident.color);
        }
        group.appendChild(head);
        renderItems(members, group);
        blockedList.appendChild(group);
      }
    }

    function renderItems(raises, container) {
      for (const r of raises) {
        const isLabel = r.source === 'label';
        const isPerson = r.source === 'person';
        const who = isLabel
          ? { glyph: '🏷️', name: 'label', color: 'var(--accent-idea)' }
          // Fall back rather than throw: a fixture or a stranger's board can
          // name someone the roster has never heard of, and an unknown person
          // must still be VISIBLE. Silently dropping them is the failure this
          // card exists to remove.
          : ((typeof identityOf === 'function' && identityOf(r.by)) || { glyph: '', name: r.by, color: 'var(--muted)' });
        const item = document.createElement('div'); item.className = 'blocked-item'; item.style.setProperty('--mind', who.color);
        const top = document.createElement('div'); top.className = 'blocked-item-top';
        const raiser = document.createElement('span'); raiser.className = 'blocked-who';
        // #485 — a 🚧 raise names WHO RAISED IT, so the slot shows the raiser.
        //
        // A directed ask names who is WAITED ON — and that now lives on the
        // GROUP heading, so repeating it per item said "waiting on michael" ten
        // times under a heading reading WAITING ON MICHAEL. Caught by looking at
        // the render; the DOM assertions were all satisfied. So inside a person
        // group the slot carries the CARD TITLE instead, which is the one thing
        // that distinguishes one of his ten asks from another.
        raiser.textContent = isPerson
          ? (r.card ? r.card.title : '(card missing)')
          : (who.glyph ? who.glyph + ' ' : '') + (who.name || r.by);
        const src = document.createElement('span'); src.className = 'blocked-src';
        src.textContent = isPerson ? 'directed' : (isLabel ? 'label' : 'raise');
        src.title = isPerson
          ? 'A structured blocker (scrum:blockedByPerson) naming this person'
          : 'A 🚧 post on the card, or the `blocked` label — undirected';
        const ref = document.createElement('span'); ref.className = 'blocked-ref'; ref.textContent = r.card ? '#' + r.card.shortId : '';
        top.append(raiser, src, ref);
        const ask = document.createElement('div'); ask.className = 'blocked-ask'; ask.textContent = r.ask || '(no detail given)';
        // The clamp hides the tail, so the full text has to stay reachable
        // without a navigation. The source now has its own chip.
        // ⚠️ Hover is NOT an affordance for keyboard or touch users, so `title`
        // is supplementary only. The real control is the button below.
        ask.title = r.ask || '';
        // #485 — AN ACCESSIBLE EXPAND. The clamp is for scanning; the full note
        // has to be reachable by click, Enter/Space and tap, not just by having
        // a mouse. Rendered only when there is actually something hidden.
        let more = null;
        if ((r.ask || '').length > 180) {
          more = document.createElement('button');
          more.className = 'blocked-more'; more.type = 'button';
          more.setAttribute('aria-expanded', 'false');
          more.textContent = 'Show full ask';
          more.onclick = (e) => {
            e.stopPropagation();
            const open = ask.classList.toggle('expanded');
            more.setAttribute('aria-expanded', String(open));
            more.textContent = open ? 'Show less' : 'Show full ask';
          };
        }
        const foot = document.createElement('div'); foot.className = 'blocked-foot';
        const openCard = document.createElement('a'); openCard.className = 'blocked-open-card';
        openCard.textContent = (r.card ? r.card.title : 'open card') + ' →';
        openCard.href = r.card ? 'index.html?card=' + r.card.shortId : '#';
        // #758 — opens IN PLACE (the sheet); the href stays for a modifier-click or a new tab
        if (r.card) openCard.dataset.openCard = String(r.card.shortId);
        const done = document.createElement('button'); done.className = 'blocked-done'; done.type = 'button';
        done.textContent = '✓ unblocked';
        done.title = isLabel ? 'Remove the blocked label' : 'Clear this raised hand';
        done.onclick = async (e) => {
          e.stopPropagation(); done.disabled = true;
          try {
            if (isLabel) {
              // Label blocker: remove the label from the card
              const card = r.card;
              if (card) {
                const newLabels = (card.labels || []).filter(l => l !== BLOCKED_LABEL);
                await fetch('/api/cards/' + card.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ labels: newLabels }) });
              }
            } else {
              // Raise: post a ✅ resolution to the conversation thread.
              //
              // Authored as `system`, NOT as a person. This page has no identity
              // picker, so there is no trustworthy answer to "who clicked this" —
              // and the previous code answered it anyway, hardcoding a seat name.
              // That meant the software wrote a fictional person into a real
              // user's board history every time anyone cleared a raised hand.
              //
              // The rule this encodes: if the runtime cannot know who acted, it
              // records that an action happened, never who did it. An honest
              // system event beats an invented author, because a board whose
              // history is partly fabricated is worse than one that admits a gap.
              await fetch('/api/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ attachedTo: r.cardId, author: 'system', body: '✅ unblocked (cleared from the raised-hands panel)' }) });
            }
            refreshBlocked();
          } catch (_) { done.disabled = false; }
        };
        // ⛔ #485/#466 — NO clear control on a directed ask. `blockers` is a
        // whole-array replace, so clearing one entry from a page that reloads
        // every 8s can silently delete a sibling written seconds earlier. That
        // race is measured (#466, two seats, 40s apart, one blocker lost). The
        // read-only panel is the honest slice until per-entry writes exist.
        if (isPerson) foot.append(openCard);
        else foot.append(openCard, done);
        if (more) item.append(top, ask, more, foot);
        else item.append(top, ask, foot);
        container.appendChild(item);
      }
    }

    // Scan card-attached posts AND card labels for blockers.
    // Cards with an open 🚧 raise appear via their conversation thread.
    // Cards labelled `blocked` appear as static blockers.
    // Returns {cardId, by, ask, at, card, source}[] freshest-first.
    function openRaises(convos, cardById) {
      const byCard = new Map();
      for (const m of convos) {
        if (!m.attachedTo) continue;
        if (!byCard.has(m.attachedTo)) byCard.set(m.attachedTo, []);
        byCard.get(m.attachedTo).push(m);
      }
      const raises = [];
      const seen = new Set();
      for (const [cardId, msgs] of byCard) {
        msgs.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        let open = null;
        for (const m of msgs) {
          if (RAISE_RE.test(m.body || '')) open = m;
          else if (RESOLVE_RE.test(m.body || '')) open = null;
        }
        if (open) {
          raises.push({ cardId, by: open.author, ask: (open.body || '').replace(RAISE_RE, '').trim(), at: open.createdAt, card: cardById.get(cardId), source: 'raise' });
          seen.add(cardId);
        }
      }
      // #485 — DIRECTED ASKS, from #881's structured `blockers` field.
      //
      // The two scans above read a registry the room stopped writing to. Every
      // ask that actually names a human now lands in `blockers`, because that is
      // what the MCP tooling and board_ready use. On 2026-08-20 the panel read
      // `· 1` while eleven cards carried an open blocker naming @michael, and he
      // said in the commons that he was reading that as "nothing is waiting on
      // me". The panel was honest and pointed at the wrong shelf.
      //
      // ⚠️ NOT filtered to a viewer. #485's standing rule: on a board with no
      // authentication there is no "you" to compute, and its reopening note
      // forbids manufacturing one. So this shows every open directed ask and
      // NAMES who each waits on — fail honest, not fail personalized.
      //
      // ⛔ NOT deduped against 🚧 raises: a card can carry both, and they are
      // different asks by different people. Collapsing them would hide one.
      //
      // ⛔ NO CLEAR CONTROL, deliberately (renderBlocked omits the button for
      // these). `blockers` is a whole-array replace — #466 measured two seats
      // writing it 40s apart and one silently deleting the other's entry. A
      // per-entry clear from a page that reloads every 8s would race exactly
      // that way. Read-only until #466 lands.
      for (const [cardId, card] of cardById) {
        for (const b of (card.blockers || [])) {
          if ((b.status || 'open') === 'cleared') continue;   // #881 built status so the queue CONVERGES
          if (b.card !== undefined && b.person === undefined && b.anyHuman !== true) continue; // card-blocker: work waiting on work
          const person = b.anyHuman === true ? 'any human' : b.person;
          if (!person) continue;
          raises.push({
            cardId,
            by: person,
            ask: b.note || '(no detail given)',
            at: card.updatedAt || card.createdAt,
            card,
            source: 'person',
          });
        }
      }

      // Also scan cards for the label BLOCKED_LABEL
      for (const [cardId, card] of cardById) {
        if (seen.has(cardId)) continue; // raise already covers this card
        if ((card.labels || []).includes(BLOCKED_LABEL)) {
          // #758 (decided 2026-08-09): the label path IS the empty case — say so,
          // never restate the label as if it were an ask. And a card in `done`
          // is not waiting on anyone: closing a card clears its raise.
          if (card.column === 'done') continue;
          raises.push({ cardId, by: 'label', ask: '(no detail given)', at: card.updatedAt || card.createdAt, card, source: 'label' });
          seen.add(cardId);
        }
      }
      raises.sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
      return raises;
    }

    // #209 — the paged SUMMARY projection, never the bare full-body read.
    // Bare /api/cards ships every card WITH its description: 998 cards,
    // 8.49 MB, measured 2026-08-31 — and this page called it twice to answer
    // questions that need title/blockers/labels/claim state and never a body.
    // /api/cards?limit=500 returns {cards, cardsTotal} WITHOUT descriptions
    // (616 KB/page) carrying every field these consumers use.
    //
    // Pages arrive ASCENDING; the next-older page is fetched with
    // before=<LOWEST shortId seen> — cards[0], never cards[-1], which
    // advances one card per page and reads exactly like broken pagination
    // (#209's measured cursor mechanics). Loops to COVERAGE against
    // cardsTotal so a partial corpus cannot render silently; a shortfall is
    // logged loudly rather than passed off as the world (#1010's rule: the
    // surface must not promise the corpus and filter a buffer).
    async function fetchCardSummaries() {
      const all = [];
      let before = null;
      let total = null;
      for (let i = 0; i < 20; i++) {           // hard bound: 20 pages = 10,000 cards
        const q = '/api/cards?limit=500' + (before != null ? '&before=' + encodeURIComponent(before) : '');
        const res = await (await fetch(q)).json();
        const page = Array.isArray(res) ? res : (res && Array.isArray(res.cards) ? res.cards : []);
        if (total == null && res && typeof res.cardsTotal === 'number') total = res.cardsTotal;
        if (!page.length) break;
        all.push(...page);
        if (total != null && all.length >= total) break;
        before = page[0].shortId;              // ASCENDING pages: [0] is the lowest
      }
      if (total != null && all.length < total) {
        console.warn(`[#209] card summary paging fell short: ${all.length} of ${total} — downstream panels may be incomplete`);
      }
      return all;
    }

    // #1392 — the poll keeps STATE and reads DELTAS. Measured 2026-09-15 on
    // prod: the previous shape fetched every conversation (45 MB, 27k
    // messages, 0.5 s of REST) and every card page, every 8 s, per open tab,
    // and re-rendered whether or not anything had changed — ~80 MB of JSON
    // churn per tick and ~6 % of REST's single thread for a panel that moves
    // a few times a day. Now: one full read at boot, then `since=` /
    // `updatedSince=` (both already served) merged into these maps, and a
    // render only when a delta actually arrived.
    //
    // Both server filters are INCLUSIVE (`>=`), so the newest row comes back
    // again each tick — the merge is keyed by id, so that costs one row, not
    // a rebuild. Stamps advance from what the SERVER returned, never from
    // this machine's clock. A card deleted after boot stays in the map until
    // reload; the panel already skips `done`, and deletion is rare enough
    // that a reload is the honest answer rather than a fourth read. The same
    // class: a raise message REDACTED after boot — `since=` never returns a
    // removed row, so that hand stays up until reload (2 redactions in 31k
    // events when this shipped; the review that found it is on #1392).
    //
    // Only the rows `openRaises` can read are KEPT: attached to a card and
    // starting with 🚧 or ✅. Measured 2026-09-15T11:44Z, 25 min into the 24 h
    // run of the first cut: keeping every message made the retained heap a
    // flat 87 MB per tab (27k rows) — the churn was gone but the corpus had
    // moved in. The stamp still advances over EVERY row the server returned,
    // kept or not, so the next delta starts where this one ended.
    const blocked = { convos: new Map(), cards: new Map(), convoSince: null, cardSince: null, loaded: false };
    const maxStamp = (cur, rows, key) => rows.reduce((m, r) => (typeof r[key] === 'string' && (!m || r[key] > m) ? r[key] : m), cur);
    const raiseRow = (m) => m && typeof m.attachedTo === 'string' && m.attachedTo
      && (RAISE_RE.test(m.body || '') || RESOLVE_RE.test(m.body || ''));
    async function refreshBlocked() {
      try {
        let changed = false;
        if (!blocked.loaded || !blocked.convoSince || !blocked.cardSince) {
          const [convos, cards] = await Promise.all([
            fetch('/api/conversations').then((r) => r.json()),
            fetchCardSummaries(),
          ]);
          const rows = Array.isArray(convos) ? convos : [];
          for (const m of rows) if (raiseRow(m)) blocked.convos.set(m.id, m);
          for (const c of (Array.isArray(cards) ? cards : [])) blocked.cards.set(c.id, c);
          blocked.convoSince = maxStamp(blocked.convoSince, rows, 'createdAt');
          blocked.cardSince = maxStamp(blocked.cardSince, [...blocked.cards.values()], 'updatedAt');
          blocked.loaded = true;
          changed = true;
        } else {
          const [convos, res] = await Promise.all([
            fetch('/api/conversations?since=' + encodeURIComponent(blocked.convoSince)).then((r) => r.json()),
            fetch('/api/cards?limit=500&updatedSince=' + encodeURIComponent(blocked.cardSince)).then((r) => r.json()),
          ]);
          const cards = res && Array.isArray(res.cards) ? res.cards : [];
          for (const m of (Array.isArray(convos) ? convos : [])) {
            if (!raiseRow(m) || blocked.convos.has(m.id)) continue;
            blocked.convos.set(m.id, m);
            changed = true;
          }
          for (const c of cards) {
            const prev = blocked.cards.get(c.id);
            if (prev && prev.updatedAt === c.updatedAt) continue;
            blocked.cards.set(c.id, c);
            changed = true;
          }
          blocked.convoSince = maxStamp(blocked.convoSince, Array.isArray(convos) ? convos : [], 'createdAt');
          blocked.cardSince = maxStamp(blocked.cardSince, cards, 'updatedAt');
        }
        if (!changed) return;
        const cardById = blocked.cards;
        const raises = openRaises([...blocked.convos.values()], cardById);
        blockedToggle.textContent = `🚧 Raised hands · ${raises.length}`;
        blockedToggle.classList.toggle('has-items', raises.length > 0);
        renderBlocked(raises, cardById);
      } catch (_) { /* offline — leave last state */ }
    }
    refreshBlocked();
    setInterval(refreshBlocked, 8000);

    const node = new URLSearchParams(location.search).get('node');
    const viewEl = document.getElementById('view');

    /**
     * #517 — arrive where the reader was.
     *
     * `?at=<message id>` is stamped on the panel's "⤢ Full page" link at click
     * time (core/commons-panel.mjs). You hit ⤢ because you want more room to
     * read the thing you are reading; landing at the feed's default is the one
     * outcome that makes the control useless for its purpose.
     *
     * Anchored to a message id rather than a scroll offset on purpose: the
     * whole reason to promote is that the panel is too narrow, so the
     * destination reflows and an offset means something different there.
     *
     * Called on every render because the message may not be in the first batch
     * — it runs until it lands once, then stops.
     */
    const anchorAt = new URLSearchParams(location.search).get('at');
    let _anchored = false;
    function anchorToPlace() {
      if (_anchored || !anchorAt) return;
      const target = viewEl.querySelector(`[data-id="${CSS.escape(anchorAt)}"]`);
      if (!target) return;                    // not rendered yet — try again next batch
      _anchored = true;
      target.scrollIntoView({ block: 'center' });
      target.classList.add('cv-msg-arrived');
    }
    const title = document.getElementById('title');
    const back = document.getElementById('back');

    async function init() {
      if (node) {
        // Promoted thread: a node's homed discussion, full-page. Title from the node.
        try {
          const res = await fetch('/api/nodes/' + encodeURIComponent(node));
          if (res.ok) {
            const { node: n } = await res.json();
            title.textContent = '💬 ' + (n?.name || 'Discussion');
          } else {
            title.textContent = '💬 Discussion';
          }
        } catch (_) { title.textContent = '💬 Discussion'; }
        document.title = title.textContent.replace('💬 ', '') + ' · Commons';
        back.textContent = '↩ open the page';
        back.href = '/wiki.html?node=' + encodeURIComponent(node);
        back.style.display = '';
      }
      // #294 — in the UNSCOPED room only, collapse card-attached posts to
      // pointers. Resolve a card UUID → its #NNN + title via a lazily-built
      // index (cards fetched once; refreshed with the blocked poll).
      let cardIndex = new Map();
      async function buildCardIndex() {
        try {
          const cards = await fetchCardSummaries();   // #209 — summary, paged, never the 8.5 MB bare read
          cardIndex = new Map(cards.map((c) => [c.id, c]));
        } catch (_) { /* keep last */ }
      }
      const attachedPointer = node ? undefined : (msg) => {
        const c = cardIndex.get(msg.attachedTo);
        const label = c ? `#${c.shortId} «${c.title}» — conversation updated`
                        : 'card conversation updated';
        return { label, href: 'commons.html?node=' + encodeURIComponent(msg.attachedTo) };
      };
      if (!node) await buildCardIndex();

      // #1010 — `?limit=N` bounds the initial window (default 50). Exists so a
      // reader — or a test — can make the window small and see that search
      // reaches past it; the corpus search is what makes a small window safe.
      const limitParam = Number(new URLSearchParams(location.search).get('limit'));
      // #1368 — a card's thread is a GROOMING thread: the PO's answers are
      // badged, a comment can become a ruling on the card, and `?groom=1`
      // (the card's "Groom this" door) arrives with the PO mentioned.
      const groom = new URLSearchParams(location.search).get('groom') === '1';
      // #1401 — `?conversation=<talk id>`: the 1:1 view. A talk is a small
      // node (title · with · who opened it); the posts are the room's own,
      // tagged. The view filters to the tag the way a seat solo filters to a
      // voice; nothing here is private, and "show the whole room" is one link.
      const talkId = new URLSearchParams(location.search).get('conversation');
      let talk = null;
      let talkActions = null;   // #1409 — built with the head, mounted on the form's talk-note
      if (talkId) {
        try { const r = await fetch('/api/talks/' + encodeURIComponent(talkId)); if (r.ok) talk = await r.json(); } catch { /* falls through to the plain room */ }
      }
      let groomCard = null;
      let cardFull = null;
      if (node) {
        try { const r = await fetch('/api/cards/' + encodeURIComponent(node)); if (r.ok) { const c = await r.json(); if (c && c.shortId != null) { groomCard = { id: c.id, shortId: c.shortId }; cardFull = c; } } } catch { /* a thread on a non-card node has no ruling affordance */ }
      }
      const poSeat = node ? await resolveRoleHolder('po') : null;
      // #1391 — a card's thread shows the CARD above it. The owner's first
      // thirty seconds in the grooming view: "no way to see what's on the card
      // right now" — he was writing about a card he could not see.
      let leading = null;
      if (cardFull) {
        const head = renderCardHead(cardFull, { doc: document });
        head.id = 'thread-head';
        // The feed is the page's scroller and the column is fixed-height, so
        // the head must not eat the feed: the description folds behind one
        // toggle and the choice is remembered per card. OPEN BY DEFAULT on
        // every window: the first cut opened it only above 900 px, and the
        // owner's read (#1385 row 4, 2026-09-15 17:44Z) was that the view
        // "just repeats the title" — the card he came to groom was hidden
        // behind a toggle he had no reason to press. A short window scrolls;
        // a card you can't see is the finding this card exists for.
        const body = head.querySelector('.card-head-body');
        const key = `manyhands.groom.head-open.${cardFull.id}`;
        let open; try { open = localStorage.getItem(key); } catch { open = null; }
        const isOpen = open == null ? true : open === '1';
        const toggle = document.createElement('button'); toggle.type = 'button'; toggle.className = 'card-head-toggle';
        const paint = (on) => { body.hidden = !on; toggle.textContent = on ? 'Hide the description ▴' : 'Show the description ▾'; toggle.setAttribute('aria-expanded', String(on)); };
        toggle.addEventListener('click', () => { const on = body.hidden; paint(on); try { localStorage.setItem(key, on ? '1' : '0'); } catch { /* fine */ } });
        head.insertBefore(toggle, body);
        paint(isOpen);
        leading = head;   // lives at the top of the feed and scrolls with it, so the feed keeps its height
      }
      if (talk) {
        // #1401 — the talk's head sits first in the feed, like a card's (#1391).
        const head = document.createElement('div'); head.className = 'talk-head'; head.id = 'talk-head';
        const h2 = document.createElement('h2'); h2.textContent = `🗣 Talk with ${talk.with} — ${talk.title}`;
        const meta = document.createElement('div'); meta.className = 'talk-meta';
        meta.append(document.createTextNode(`opened by ${talk.openedBy || '?'} · ${talk.openedAt ? new Date(talk.openedAt).toLocaleString() : ''} · `));
        const whole = document.createElement('a'); whole.href = 'commons.html'; whole.textContent = 'show the whole room'; whole.className = 'talk-whole-room';
        meta.append(whole);
        // #1409 — two controls the owner could not find as a link: LEAVE (back
        // to the room; the talk stays open and listed) and CLOSE (ends it —
        // closedAt written, view read-only, gone from the default list; a
        // participant can REOPEN). Closing takes you back to the room.
        const actions = document.createElement('span'); actions.className = 'talk-actions';
        const leave = document.createElement('button'); leave.type = 'button'; leave.id = 'talk-leave'; leave.textContent = '↩ Leave talk';
        leave.title = 'Back to the whole room. The talk stays open; find it again by its link.';
        leave.addEventListener('click', () => { location.href = 'commons.html'; });
        actions.append(leave);
        const whoAmI = () => (document.querySelector('.cv-who')?.value || '').trim() || 'michael';
        const err = document.createElement('span'); err.className = 'talk-error'; err.id = 'talk-head-error'; err.setAttribute('role', 'alert');
        const setClosed = async (closed) => {
          err.textContent = '';
          const r = await fetch('/api/talks/' + encodeURIComponent(talk.id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ by: whoAmI(), closed }) });
          const j = await r.json().catch(() => ({}));
          // inline, never a native modal — a modal freezes the page for an agent (the suite's own rule)
          if (!r.ok) { err.textContent = j.error || `refused (${r.status})`; return false; }
          return true;
        };
        if (!talk.closedAt) {
          const close = document.createElement('button'); close.type = 'button'; close.id = 'talk-close'; close.textContent = '✔ Close talk';
          close.title = 'End this talk. It becomes read-only (a participant can reopen it) and you go back to the room.';
          close.addEventListener('click', async () => { if (await setClosed(true)) location.href = 'commons.html'; });
          actions.append(close);
        } else {
          head.classList.add('talk-closed');
          const reopen = document.createElement('button'); reopen.type = 'button'; reopen.id = 'talk-reopen'; reopen.textContent = '↺ Reopen';
          reopen.addEventListener('click', async () => { if (await setClosed(false)) location.reload(); });
          actions.append(reopen);
        }
        actions.append(err);
        // #1409 (2026-09-21): the controls do NOT live in the head. The head is
        // the FIRST element of a feed that scrolls to its newest post, so the
        // owner never saw them — his screenshot had a one-row feed (#1431) and
        // the buttons above its fold. They go on the talk-note line inside the
        // form, which is on screen in every state; the head keeps the title.
        // A CLOSED talk hides its composer (and the form the note lives in), so
        // its Reopen stays in the head, where the closed line is.
        if (talk.closedAt) h2.append(actions); else talkActions = actions;
        head.append(h2, meta);
        if (talk.closedAt) {
          const note = document.createElement('p'); note.className = 'talk-closed-note'; note.id = 'talk-closed-note';
          note.textContent = `closed ${new Date(talk.closedAt).toLocaleString()} — read-only; reopen to continue.`;
          head.append(note);
        }
        leading = head;
        document.title = `${talk.closedAt ? '(closed) ' : ''}Talk with ${talk.with} — ${talk.title}`;
      }
      view = mountConversationView({
        mount: viewEl,
        ...(talk && talk.closedAt ? { readOnly: true } : {}),   // #1409 — a closed talk takes no posts
        ...(Number.isInteger(limitParam) && limitParam > 0 ? { limit: limitParam } : {}),
        attachedTo: node || undefined,   // node ⇒ that thread; absent ⇒ the whole commons
        poll: true,
        poSeat, groom, card: groomCard,   // #1368
        talk,                             // #1401
        leading,                          // #1391
        placeholder: talk ? `Say something to ${talk.with} — the room can read it` : (node ? (groom ? 'Ask the PO — what do you need to know to start?' : 'Add to this discussion…') : 'Say something to the room…'),
        attachedPointer,                 // #294 — pointer-collapse in the unscoped room
        onMessages: (msgs) => { _lastMessages = msgs; updateConstellation(msgs); anchorToPlace(); }, // presence pulse · #517 arrive where the reader was
        onSolo: reflectSolo,             // presence — sync the constellation to the soloed mind
      });
      // #1391 — before the first post: what posting here DOES, and who it wakes —
      // the PO from the board (declaration first, roster fallback), never a name typed here.
      if (groomCard) {
        const form = viewEl.querySelector('.cv-form');
        if (form) {
          const note = document.createElement('div'); note.className = 'groom-note';
          note.textContent = `Posting here adds to #${groomCard.shortId}'s thread — public, like the rest of the board — and ${poSeat ? `wakes @${poSeat}, who holds the PO role` : 'would wake the PO, but no seat holds the PO role right now'}.`;
          form.prepend(note);
        }
      }
      if (talk) {
        const form = viewEl.querySelector('.cv-form');
        if (form) {
          const note = document.createElement('div'); note.className = 'talk-note';
          note.textContent = `Posting here tags the post into this talk and wakes @${talk.with} — it is public, like the rest of the room, and shows inline in the whole stream.`;
          if (talkActions) note.append(talkActions);   // #1409 — Leave / Close where the owner can see them
          form.prepend(note);
        }
      }
      // #758 — a #NNN in the feed, or a raised-hand entry, opens the card HERE.
      // Closing the sheet leaves the room exactly where it was.
      wireCardRefs(document.body, { keepScroll: ['.cv-feed'], onMissing: (k) => { const m = document.createElement('div'); m.className = 'card-sheet-missing'; m.textContent = `No card #${k} on this board.`; document.body.appendChild(m); setTimeout(() => m.remove(), 2500); } });
      window.openCardSheet = openCardSheet;   // for the raised-hands panel and tests
    }

    // #1401 — the door. Pick a seat, one line of topic → POST /api/talks →
    // open the view. An inline form, never a native prompt (#481 froze
    // agent-driven browsers on prompt()). The roster is the seat list.
    (function wireTalkDoor() {
      const toggle = document.getElementById('talk-toggle');
      const form = document.getElementById('talk-form');
      const sel = document.getElementById('talk-with');
      const title = document.getElementById('talk-title');
      const err = document.getElementById('talk-error');
      if (!toggle || !form) return;
      let loaded = false;
      async function loadSeats() {
        if (loaded) return;
        try {
          const r = await fetch('/api/roster'); const j = await r.json();
          const seats = j && j.seats && typeof j.seats === 'object' ? j.seats : {};
          sel.innerHTML = '';
          for (const [key, v] of Object.entries(seats)) {
            if (v && v.kind === 'system') continue;   // wiki/board are not someone to talk with
            const o = document.createElement('option'); o.value = key; o.textContent = `${v && v.emoji ? v.emoji + ' ' : ''}${v && v.name ? v.name : key}`;
            sel.appendChild(o);
          }
          loaded = sel.options.length > 0;
        } catch { err.textContent = 'could not read the roster'; }
      }
      toggle.addEventListener('click', async () => { form.hidden = !form.hidden; if (!form.hidden) { await loadSeats(); title.focus(); } });
      // #1409 — a seat chip opens the same door with that seat chosen.
      window.openTalkDoor = async (seatKey) => { form.hidden = false; await loadSeats(); if (seatKey) sel.value = seatKey; title.focus(); };
      document.getElementById('talk-cancel').addEventListener('click', () => { form.hidden = true; err.textContent = ''; });
      form.addEventListener('submit', async (e) => {
        e.preventDefault(); err.textContent = '';
        // The opener is whoever the composer is set to speak as — the same
        // select the posts use — so the talk's `openedBy` matches its first post.
        const by = (document.querySelector('.cv-who')?.value || '').trim() || 'michael';
        try {
          const r = await fetch('/api/talks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ with: sel.value, title: title.value.trim(), by }) });
          const j = await r.json();
          if (!r.ok) { err.textContent = j.error || `refused (${r.status})`; return; }
          location.href = 'commons.html?conversation=' + encodeURIComponent(j.id);
        } catch (ex) { err.textContent = 'could not open the talk: ' + ex.message; }
      });
    })();

    // #303-7 — delivery observability. Poll the (same-origin) channel-status
    // proxy and show "🛰 N delivering" when the router has staggered posts still
    // in flight — so a quiet room reads as "N pending", not "is everyone okay?".
    const deliveryEl = document.getElementById('delivery-status');
    async function pollDelivery() {
      try {
        const res = await fetch('/api/channel-status');
        if (!res.ok) { deliveryEl.textContent = ''; return; }
        const s = await res.json();
        deliveryEl.textContent = (s.pending > 0)
          ? `🛰 ${s.pending} delivering…`
          : (s.receivers ? `🛰 ${s.receivers} listening` : '');
        deliveryEl.title = `mode: ${s.mode} · ${s.receivers || 0} receiving · ${s.pending || 0} in flight`;
      } catch (_) { deliveryEl.textContent = ''; }
    }
    pollDelivery();
    setInterval(pollDelivery, 4000);

    init();
  </script>
</body>
</html>
