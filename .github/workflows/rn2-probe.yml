# #1672 — a THROWAWAY probe for RN2's intermittent Linux red. Lives only on the exp/1672-rn2-linux branch; never merged.
# No artifact upload (ci.yml's rule): a failing row already writes every `# tmp:` report line and RN2's survivor facts
# into its assertion message, which lands in the job log.
name: rn2-probe

on:
  push:
    branches: ['exp/1672-rn2-linux']

permissions:
  contents: read

env:
  PREREG: |
    ## How to read the first RN2 red (written BEFORE the run)
    OBSERVATIONS to look for, about the survivors, in the nested run's `# tmp:` lines:
    - `still alive after N ms of kills` naming them: STUBBORN, seen as owned, killed, still alive at the bound.
    - `is not this run's but uses ... NOT killed` naming them: NOT IDENTIFIED AS OWNED (a stranger). On Linux that
      includes a process whose environment could not be read at that moment.
    - no line naming them: a GAP to investigate, NOT a cause.
    - (`ownership could not be decided` cannot appear on Linux: the Linux path never marks a process undecidable.)
    HYPOTHESES (unverified, kept separate): on Linux an unreadable or empty /proc/<pid>/environ is silently
    treated as NOT OWNED, so a child caught mid-exec could be read as tokenless (a stranger line) or skipped (no line).
    The suite jobs run WITHOUT the AppArmor sysctl that ci.yml uses, so served-browser rows may fail here; only RN/RN2
    lines are evidence for this probe. Browser failures are labelled separately, and their early exit may change the
    suite's load, so a suite job here is not load-equivalent to a ci.yml run. Only an informative RN2 red stops the probe.
    A green across every job is a bounded sample at one sha, not proof the race is absent, and does not clear the hold.

jobs:
  suite:
    name: full server suite ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pre-registered reading
        run: printf '%s\n' "$PREREG" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the server suite
        run: npm run test:server

  rn2-loop:
    name: RN2 alone x30 (${{ matrix.load }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        load: [quiet, burn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pre-registered reading
        run: printf '%s\n' "$PREREG" >> "$GITHUB_STEP_SUMMARY"
      - name: RN2, 30 times, stopping at the first red
        run: |
          burners=''
          cleanup() { for b in $burners; do kill "$b" 2>/dev/null || true; done; }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          if [ "${{ matrix.load }}" = burn ]; then
            for c in $(seq 1 "$(nproc)"); do yes > /dev/null & burners="$burners $!"; done
            echo "burners:$burners"
          fi
          rc=0
          for i in $(seq 1 30); do
            echo "=== RN2 loop $i at $(date -u +%H:%M:%SZ) load $(cut -d' ' -f1-3 /proc/loadavg)"
            if ! node --test --test-reporter=tap --test-name-pattern='RN2 ' tests/tmpstore-leak-1672.test.mjs; then
              echo "=== RED on loop $i"; rc=1; break
            fi
          done
          exit $rc
