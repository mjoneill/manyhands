# #837 — the suite runs without anyone remembering to run it.
#
# Until now every invariant this repo encodes as a test was enforced by memory:
# 1393 server tests that execute only when a human types `npm run test:server`.
# A test nobody runs automatically is a convention with extra steps, and the
# room has repeatedly reasoned as though the suite were a gate — commit messages
# ending "tests pass" read as "the suite is protecting this" when they only ever
# meant "I ran it".
#
# ⛔ THE CONDITION THIS FILE SHIPS UNDER, from the repo owner:
#     CI is welcome "provided that the tests don't leak the very things we're
#     trying to catch in our release gates."
#
# A public job log publishes everything the suite prints, to anyone, for as long
# as the repo exists — so this workflow is deliberately minimal about what it
# emits. Measured before it was written: the full 8,605-line suite output
# contains ZERO occurrences of the vocabulary the publication gate exists to
# catch. The only home-directory paths in it are the local checkout path, which
# on a runner is the runner's own.
#
# ⇒ Hygiene rules for anyone editing this file:
#   · NO `env` dump, no `set -x`, no `printenv`, no `cat` of any data file.
#   · NO artifact upload of board data, exports, fixtures or logs.
#   · NO secrets. This workflow needs none, and adding one would make fork PRs
#     a credential-exfiltration surface for a repo whose whole threat model is
#     that the coordination channel is an actuator.
#   · least-privilege token, declared below rather than inherited.
#
# ⚠️ CORRECTED after the first CI run, 2026-08-18. The original split assumed
# `test:server` needed no browser. It does — scripts/run-tests.sh runs every
# file in tests/, five of which import puppeteer. The name said "server"; the
# script said "everything". Both jobs now install Chromium and both relax the
# runner's AppArmor namespace restriction, without which Chromium aborts
# before a single test runs.
#
# ⚠️ The vocabulary guard is NOT here and must not be moved here. It lives in
# the private pre-push gate, which holds the real list. Putting that list into
# a public workflow to check that it stays out of the public repo is circular:
# the check would publish exactly what it exists to protect. The two rails guard
# different boundaries on purpose — the gate guards PUBLICATION, this guards
# CORRECTNESS.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, stated rather than inherited from repo defaults.
permissions:
  contents: read

# #1108 — keyed on the SHA, not the ref. Keyed on the ref, any push to main
# cancelled an in-flight re-run of any OLDER sha, and a re-run overwrites that
# sha's conclusion in `gh run list` — which is what the deploy gate reads. So
# "re-run a green sha to count flakes" + "anyone pushes" made that sha read
# `cancelled` and become undeployable, with no override by design. Per-sha
# groups still coalesce repeated runs of the SAME commit; they just stop
# treating a neighbour's re-run as collateral.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  server:
    name: server suite
    runs-on: ubuntu-latest
    # #1690 — the executor-backed tests now run here instead of skipping; the trial took 17 min against 20.
    timeout-minutes: 30
    steps:
      # #1690 — test the PR HEAD, not GitHub's merge ref, so the receipt's sha can be verified against the tree that
      # was tested. That is the tree that lands ONLY if the head is rebased onto current main and main fast-forwards
      # to it: the practice since 10-06 (not a written rule), though origin/main still holds 30 older merge commits. A head tested
      # alone says nothing about main + head if main has moved; rebase and re-run before landing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor, and
      # Chromium's sandbox needs them: without this it aborts with "No usable
      # sandbox!" before any test runs. Confined to the runner; the alternative
      # (--no-sandbox in launch args) would weaken the sandbox everywhere,
      # including locally, to work around a CI-only policy.
      - name: Allow Chromium's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # #1690 (decision 45a5d8e4) — CI runs every test it can, so the graph executor's tests need its python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graph executor venv (pinned requirements)
        run: python -m venv graph-executor/.venv && graph-executor/.venv/bin/pip install -r graph-executor/requirements.txt
      - name: Run the server suite
        run: |
          set +e
          set -o pipefail
          npm run test:server 2>&1 | tee server-suite.tap
          rc=$?
          echo "SUITE_EXIT=$rc" >> "$GITHUB_ENV"
          exit $rc
      # #1693 (the #1644 rescope, option A) — L1 latency runs ALONE, after the suite, with no other test sharing the
      # runner. It lives outside the suite glob, so the suite cannot see it missing; the checker below reads this step's
      # TAP and recorded exit and puts the verdict in the receipt as `l1Ok`. Runs even when the suite failed, so a red
      # suite still yields an L1 measurement. Bounds are unchanged: p95 <= 1.0 s and <= 2x the in-process p95.
      - name: L1 latency, alone
        if: always()
        run: |
          set +e
          set -o pipefail
          sh scripts/run-tests.sh tests/latency/ready-executor-1644-latency.test.mjs 2>&1 | tee l1.tap
          rc=$?
          echo "L1_EXIT=$rc" >> "$GITHUB_ENV"
          exit $rc
      # The only skips allowed are the manifest's platform-only tests, skipped as UNAVAILABLE; those run on the Mac
      # leg (scripts/run-platform-only.mjs). Runs even when the suite failed, so a red run still says what skipped.
      - name: Platform-only skips equal the manifest
        if: always()
        # The suite's own exit status is an input: skip compliance alone is not a green run. If the suite step never
        # recorded one, SUITE_EXIT is empty and the check fails closed (exit 2). The same holds for the L1 step and L1_EXIT.
        # --sha is the commit the event says should be tested; the checker verifies the checkout really is it.
        run: >-
          node scripts/check-platform-skips.mjs server-suite.tap
          --manifest tests/platform-only-manifest.json
          --root .
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --suite-exit "${SUITE_EXIT:-}"
          --l1-tap l1.tap
          --l1-exit "${L1_EXIT:-}"
          --receipt ci-platform-receipt.json
      # The receipt stays on the runner: #837 forbids uploading artifacts from this public workflow. The check prints
      # it as one `PLATFORM-RECEIPT {json}` line of allowlisted fields, and a landing recovers it from THIS step's log
      # of a named run attempt with scripts/extract-ci-receipt.mjs (whose defaults are this job's and step's names).

  browser:
    name: browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Allow Chromium's sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the browser suite
        run: npm run test:browser
